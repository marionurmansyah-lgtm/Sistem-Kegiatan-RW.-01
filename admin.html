<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - Sinergi RW.01</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .nav-active { background: #059669; color: white; border-radius: 12px; }
    .branding-line { height: 5px; width: 100%; background: linear-gradient(to right, #e11d48 25%, #f1f5f9 25%, #f1f5f9 50%, #fbbf24 50%, #fbbf24 75%, #059669 75%); position: fixed; top: 0; left: 0; z-index: 1000; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="pb-24">
<div class="branding-line"></div>

<header class="bg-white p-6 shadow-sm sticky top-0 z-50 border-b">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black text-emerald-900 tracking-tighter">CONTROL CENTER</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">RW.01 Kebon Manggis</p>
        </div>
        <button onclick="location.href='index.html'" class="bg-rose-500 text-white p-2 rounded-xl shadow-lg shadow-rose-200"><i data-lucide="log-out" class="w-5 h-5"></i></button>
    </div>
</header>

<main class="max-w-5xl mx-auto p-4">
    <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar">
        <button onclick="switchTab('surat')" id="tab-surat" class="nav-active flex items-center gap-2 py-3 px-5 text-xs font-black uppercase whitespace-nowrap"><i data-lucide="mail" class="w-4 h-4"></i> Surat Pengajuan</button>
        <button onclick="switchTab('upload')" id="tab-upload" class="flex items-center gap-2 py-3 px-5 text-xs font-black uppercase whitespace-nowrap"><i data-lucide="plus-circle" class="w-4 h-4"></i> Upload Konten</button>
        <button onclick="switchTab('absen')" id="tab-absen" class="flex items-center gap-2 py-3 px-5 text-xs font-black uppercase whitespace-nowrap"><i data-lucide="file-check" class="w-4 h-4"></i> Laporan Absen</button>
        <button onclick="switchTab('config')" id="tab-config" class="flex items-center gap-2 py-3 px-5 text-xs font-black uppercase whitespace-nowrap"><i data-lucide="settings" class="w-4 h-4"></i> Konfigurasi</button>
    </div>

    <div id="admin-content" class="mt-4 space-y-6"></div>
</main>

<footer class="mt-20 py-10 flex flex-col items-center border-t border-slate-200">
    <div class="h-[1px] w-12 bg-slate-300 mb-4"></div>
    <p class="text-[11px] font-black text-slate-400 tracking-[0.3em] uppercase">©2026 createdby:sekretariat_team</p>
    <p class="text-[10px] font-bold text-emerald-600 mt-1 uppercase tracking-widest">rionurmansyah & nacruli</p>
</footer>

<script>
const SB_URL = "https://ybuobehttmorjdiqwfta.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidW9iZWh0dG1vcmpkaXF3ZnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjQyMTMsImV4cCI6MjA4NzEwMDIxM30.dzdldaWRLjyTV-NK5LXZKxI2mK1MDYLHKRBXCDpMHPE";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

async function switchTab(tab) {
    const content = document.getElementById('admin-content');
    document.querySelectorAll('main button').forEach(b => b.classList.remove('nav-active'));
    document.getElementById('tab-' + tab).classList.add('nav-active');
    content.innerHTML = '<div class="flex justify-center py-20 animate-spin"><i data-lucide="loader" class="w-8 h-8 text-emerald-600"></i></div>';
    lucide.createIcons();

    if (tab === 'surat') {
        const { data } = await _supabase.from('pengajuan_surat').select('*').order('created_at', { ascending: false });
        content.innerHTML = `<h3 class="font-black text-sm mb-4 uppercase">Monitoring Surat Warga</h3>` + 
        (data.length ? data.map(s => `
            <div class="bg-white p-5 rounded-[2rem] border mb-3 flex justify-between items-center shadow-sm">
                <div>
                    <p class="text-[9px] font-black text-emerald-600 uppercase tracking-tighter">${s.jenis_surat}</p>
                    <h4 class="font-black uppercase text-xs">${s.nama} - RT ${s.rt}</h4>
                    <p class="text-[10px] text-slate-400 italic mt-1">"${s.keterangan || 'Tidak ada catatan'}"</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.open('https://wa.me/6281319934154')" class="bg-emerald-500 text-white p-3 rounded-2xl shadow-lg"><i data-lucide="phone" class="w-4 h-4"></i></button>
                </div>
            </div>`).join('') : '<p class="text-center text-slate-400 py-10">Belum ada pengajuan surat.</p>');

    } else if (tab === 'upload') {
        content.innerHTML = `
            <div class="bg-white p-6 rounded-[2rem] border shadow-sm">
                <h3 class="font-black text-sm mb-4 uppercase">Upload Agenda / Pengumuman</h3>
                <div class="space-y-4">
                    <select id="up-tipe" class="w-full p-4 bg-slate-50 border rounded-2xl text-xs font-bold">
                        <option value="Kegiatan">Kegiatan (Absensi Aktif)</option>
                        <option value="Pengumuman">Pengumuman Biasa</option>
                        <option value="Agenda">Agenda Mendatang</option>
                    </select>
                    <input type="text" id="up-judul" placeholder="Judul Konten" class="w-full p-4 bg-slate-50 border rounded-2xl text-xs">
                    <input type="date" id="up-tgl" class="w-full p-4 bg-slate-50 border rounded-2xl text-xs">
                    <textarea id="up-isi" placeholder="Isi detail informasi..." class="w-full p-4 bg-slate-50 border rounded-2xl text-xs" rows="4"></textarea>
                    <button onclick="simpanKonten()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs shadow-lg shadow-emerald-100">PUBLIKASIKAN SEKARANG</button>
                </div>
            </div>`;

    } else if (tab === 'absen') {
        const { data: kegs } = await _supabase.from('pengumuman').select('judul').eq('tipe', 'Kegiatan');
        content.innerHTML = `<div class="bg-white p-6 rounded-[2rem] border shadow-sm">
            <h3 class="font-black text-sm mb-4 uppercase">Generate Laporan PDF</h3>
            <select id="pilih-kegiatan" class="w-full p-4 bg-slate-50 border rounded-2xl text-xs font-bold mb-4">
                <option value="">-- Pilih Nama Kegiatan --</option>
                ${kegs.map(k => `<option value="${k.judul}">${k.judul}</option>`).join('')}
            </select>
            <button onclick="downloadLaporan()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black flex items-center justify-center gap-2 shadow-lg">
                <i data-lucide="download" class="w-4 h-4"></i> DOWNLOAD PDF
            </button>
        </div>`;

    } else if (tab === 'config') {
        content.innerHTML = `
            <div class="grid md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm">
                    <h3 class="font-black text-sm mb-4 uppercase text-emerald-700">📢 Running Text</h3>
                    <textarea id="set-running-text" class="w-full p-4 bg-slate-50 border rounded-2xl text-[10px]" rows="3"></textarea>
                    <button onclick="saveConfig('running_text')" class="w-full mt-3 bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase tracking-widest">Update</button>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm">
                    <h3 class="font-black text-sm mb-4 uppercase text-emerald-700">📱 WhatsApp Admin</h3>
                    <input type="tel" id="set-wa-admin" class="w-full p-4 bg-slate-50 border rounded-2xl text-xs" placeholder="62812xxx">
                    <button onclick="saveConfig('wa_admin')" class="w-full mt-3 bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase tracking-widest">Simpan</button>
                </div>
            </div>`;
        loadCurrentConfig();
    }
    lucide.createIcons();
}

async function simpanKonten() {
    const tipe = document.getElementById('up-tipe').value;
    const judul = document.getElementById('up-judul').value;
    const tgl = document.getElementById('up-tgl').value;
    const isi = document.getElementById('up-isi').value;

    if(!judul || !isi) return alert("Lengkapi data!");

    const { error } = await _supabase.from('pengumuman').insert([
        { tipe, judul, tanggal: tgl, isi, created_at: new Date() }
    ]);

    if(!error) {
        alert("Konten berhasil diupload!");
        document.getElementById('up-judul').value = "";
        document.getElementById('up-isi').value = "";
    } else {
        alert("Gagal upload: " + error.message);
    }
}

async function loadCurrentConfig() {
    const { data } = await _supabase.from('app_config').select('*');
    data.forEach(item => {
        if(item.key === 'running_text') document.getElementById('set-running-text').value = item.value;
        if(item.key === 'wa_admin') document.getElementById('set-wa-admin').value = item.value;
    });
}

async function saveConfig(key) {
    const val = key === 'running_text' ? document.getElementById('set-running-text').value : document.getElementById('set-wa-admin').value;
    await _supabase.from('app_config').upsert({ key: key, value: val }, { onConflict: 'key' });
    alert("Update Berhasil!");
}

async function downloadLaporan() {
    const keg = document.getElementById('pilih-kegiatan').value;
    if(!keg) return alert("Pilih kegiatan!");
    const { data } = await _supabase.from('absensi').select('*').eq('kegiatan_id', keg);
    if(!data.length) return alert("Belum ada data.");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text(`LAPORAN ABSENSI: ${keg}`, 10, 10);
    doc.autoTable({
        head: [['Nama', 'RT', 'Jabatan', 'Waktu']],
        body: data.map(r => [r.nama_warga, r.rt, r.jabatan, new Date(r.waktu_absen).toLocaleString('id-ID')])
    });
    doc.save(`Absen_${keg}.pdf`);
}

window.onload = () => {
    const u = JSON.parse(localStorage.getItem('user'));
    if(!u || u.role !== 'admin') location.href = 'index.html';
    switchTab('surat');
};
</script>
</body>
</html>
