<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center - Sinergi RW.01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        .tab-active { background: #059669; color: white; }
        .btn-press:active { transform: scale(0.95); transition: 0.1s; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="p-6 glass sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <img src="https://ybuobehttmorjdiqwfta.supabase.co/storage/v1/object/public/Logo/1746898459176.png" class="w-12 h-12 object-contain" alt="Logo">
            <div>
                <h1 class="text-lg font-extrabold uppercase tracking-tighter">Control Center</h1>
                <p class="text-[10px] font-bold text-emerald-600 tracking-widest uppercase italic">Administrator RW.01</p>
            </div>
        </div>
        <button onclick="logoutAdmin()" class="bg-rose-50 p-3 rounded-2xl text-rose-500 btn-press"><i data-lucide="log-out"></i></button>
    </header>

    <main class="p-6 max-w-4xl mx-auto space-y-8">
        
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="switchTab('post')" id="tab-post" class="px-6 py-3 rounded-2xl text-xs font-bold whitespace-nowrap glass tab-active btn-press">POSTING</button>
            <button onclick="switchTab('data')" id="tab-data" class="px-6 py-3 rounded-2xl text-xs font-bold whitespace-nowrap glass btn-press">DATA ABSENSI</button>
            <button onclick="window.location.href='index.html'" class="px-6 py-3 rounded-2xl text-xs font-bold whitespace-nowrap bg-slate-800 text-white btn-press">LIHAT WEB WARGA</button>
        </div>

        <section id="sec-post" class="space-y-6 animate-up">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                <h3 class="font-extrabold text-sm mb-6 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="plus-circle" class="text-emerald-500"></i> Buat Postingan Baru</h3>
                
                <div class="space-y-4">
                    <select id="post-tipe" class="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none border border-slate-100">
                        <option value="Pengumuman">Pengumuman Biasa</option>
                        <option value="Kegiatan">Kegiatan (Ada Tombol Absen)</option>
                        <option value="Dokumentasi">Dokumentasi (Hanya Foto Galeri)</option>
                    </select>

                    <input type="text" id="post-judul" placeholder="Judul Postingan" class="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none border border-slate-100">
                    
                    <textarea id="post-isi" rows="4" placeholder="Ketik isi pengumuman atau deskripsi foto di sini..." class="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none border border-slate-100"></textarea>
                    
                    <div class="p-4 border-2 border-dashed border-slate-200 rounded-2xl">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Unggah Gambar (Wajib jika Dokumentasi)</label>
                        <input type="file" id="post-file" class="text-xs">
                    </div>

                    <button onclick="handlePublish()" class="w-full bg-emerald-600 text-white py-5 rounded-3xl font-black text-xs uppercase tracking-[0.2em] shadow-lg shadow-emerald-200 btn-press">PUBLIKASIKAN SEKARANG</button>
                </div>
            </div>
        </section>

        <section id="sec-data" class="hidden space-y-6 animate-up">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-extrabold text-sm uppercase tracking-widest">Database Kehadiran</h3>
                    <button onclick="generatePDF()" class="bg-rose-600 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase flex items-center gap-2 shadow-lg btn-press">
                        <i data-lucide="file-text" class="w-4 h-4"></i> Download PDF (F4)
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table id="table-absen" class="w-full text-left text-[11px]">
                        <thead>
                            <tr class="bg-slate-50 text-slate-400 font-black uppercase">
                                <th class="p-4">Warga</th>
                                <th class="p-4">RT</th>
                                <th class="p-4">Kegiatan</th>
                                <th class="p-4">Waktu</th>
                            </tr>
                        </thead>
                        <tbody id="list-absen" class="font-bold divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script>
        // CONFIG & PROTEKSI
        const SB_URL = "https://ybuobehttmorjdiqwfta.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidW9iZWh0dG1vcmpkaXF3ZnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjQyMTMsImV4cCI6MjA4NzEwMDIxM30.dzdldaWRLjyTV-NK5LXZKxI2mK1MDYLHKRBXCDpMHPE";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        (function() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role !== 'admin') {
                alert("Akses Terlarang!");
                window.location.href = 'index.html';
            }
        })();

        // TAB LOGIC
        function switchTab(t) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button, .overflow-x-auto button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('sec-' + t).classList.remove('hidden');
            document.getElementById('tab-' + t).classList.add('tab-active');
            if(t === 'data') loadAbsensi();
            lucide.createIcons();
        }

        // POSTING LOGIC
        async function handlePublish() {
            const tipe = document.getElementById('post-tipe').value;
            const judul = document.getElementById('post-judul').value;
            const isi = document.getElementById('post-isi').value;
            const file = document.getElementById('post-file').files[0];

            if(!judul || !isi) return alert("Lengkapi data!");

            let file_url = "";
            if(file) {
                const fileName = Date.now() + "_" + file.name;
                const { data, error } = await _supabase.storage.from('Dokumentasi').upload(fileName, file);
                if(data) {
                    const { data: publicUrl } = _supabase.storage.from('Dokumentasi').getPublicUrl(fileName);
                    file_url = publicUrl.publicUrl;
                }
            }

            const table = (tipe === "Dokumentasi") ? "dokumentasi" : "pengumuman";
            const payload = (tipe === "Dokumentasi") ? { judul, file_url } : { judul, isi, tipe };

            const { error: err } = await _supabase.from(table).insert([payload]);
            if(!err) {
                alert("Berhasil Dipublikasikan!");
                location.reload();
            } else {
                alert("Gagal: " + err.message);
            }
        }

        // LOAD DATA ABSEN
        async function loadAbsensi() {
            const { data } = await _supabase.from('absensi').select('*').order('waktu_absen', {ascending:false});
            const list = document.getElementById('list-absen');
            list.innerHTML = data.map(h => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="p-4 uppercase">${h.nama_warga}</td>
                    <td class="p-4">${h.rt}</td>
                    <td class="p-4 text-emerald-600">${h.kegiatan_id}</td>
                    <td class="p-4 text-slate-400">${new Date(h.waktu_absen).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // GENERATOR PDF (STANDAR F4 & KOP SURAT)
        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', [215.9, 330.2]); // Ukuran F4 (215.9mm x 330.2mm)
            
            const { data: rawData } = await _supabase.from('absensi').select('*');
            const user = JSON.parse(localStorage.getItem('user'));

            // 1. KOP SURAT
            const logoUrl = "https://ybuobehttmorjdiqwfta.supabase.co/storage/v1/object/public/Logo/1746898459176.png";
            doc.addImage(logoUrl, 'PNG', 15, 10, 20, 20);
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("PENGURUS RUKUN WARGA 01 (RW.01)", 40, 18);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Kelurahan Kebon Manggis, Kecamatan Matraman, Jakarta Timur", 40, 23);
            doc.line(15, 32, 200, 32); // Garis Kop

            // 2. JUDUL LAPORAN
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text("LAPORAN DAFTAR HADIR KEGIATAN", 107, 45, {align: "center"});

            // 3. TABEL DATA
            const tableData = rawData.map((row, index) => [
                index + 1,
                row.nama_warga,
                row.rt,
                row.jabatan || '-',
                row.nomor_hp || '-',
                new Date(row.waktu_absen).toLocaleDateString('id-ID')
            ]);

            doc.autoTable({
                startY: 55,
                head: [['No', 'Nama Lengkap', 'RT', 'Jabatan', 'No. HP', 'Tanggal']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [30, 41, 59], fontSize: 9 },
                styles: { fontSize: 8, font: 'helvetica' }
            });

            // 4. TANDA TANGAN (TTD)
            const finalY = doc.lastAutoTable.finalY + 20;
            doc.setFontSize(10);
            doc.text(`Jakarta, ${new Date().toLocaleDateString('id-ID')}`, 150, finalY);
            doc.text("Ketua RW.01", 150, finalY + 5);
            doc.text("( .................................. )", 150, finalY + 30);

            doc.save("Laporan_Absensi_RW01.pdf");
        }

        function logoutAdmin() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
