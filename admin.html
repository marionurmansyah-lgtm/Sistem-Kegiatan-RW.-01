<body class="pb-24">
<div class="branding-line"></div>

<header class="bg-white p-5 shadow-sm sticky top-0 z-50 border-b border-slate-200">

<main class="max-w-5xl mx-auto p-4">

        <button onclick="switchTab('upload')" id="tab-upload" class="flex items-center gap-2 py-3 px-6 bg-white text-slate-600 rounded-2xl text-[11px] font-black uppercase shadow-sm border transition-all whitespace-nowrap"><i data-lucide="megaphone" class="w-4 h-4"></i> Info</button>
        <button onclick="switchTab('dokumentasi')" id="tab-dokumentasi" class="flex items-center gap-2 py-3 px-6 bg-white text-slate-600 rounded-2xl text-[11px] font-black uppercase shadow-sm border transition-all whitespace-nowrap"><i data-lucide="camera" class="w-4 h-4"></i> Galeri</button>
        <button onclick="switchTab('absen')" id="tab-absen" class="flex items-center gap-2 py-3 px-6 bg-white text-slate-600 rounded-2xl text-[11px] font-black uppercase shadow-sm border transition-all whitespace-nowrap"><i data-lucide="file-check" class="w-4 h-4"></i> Laporan</button>
        <button onclick="switchTab('config')" id="tab-config" class="flex items-center gap-2 py-3 px-6 bg-white text-slate-600 rounded-2xl text-[11px] font-black uppercase shadow-sm border transition-all whitespace-nowrap"><i data-lucide="settings" class="w-4 h-4"></i> Config</button>

</main>

</footer>

<script>

// JAM REALTIME
function updateClock() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    document.getElementById('live-clock').innerText = now.toLocaleDateString('id-ID', options);
}
setInterval(updateClock, 1000);

// FUNGSI LOGOUT
function logout() {
    localStorage.removeItem('user');
    location.href = 'index.html';
}

// SWITCH TAB LOGIC
async function switchTab(tab) {
    const content = document.getElementById('admin-content');
    document.querySelectorAll('main button').forEach(b => b.classList.remove('nav-active'));
    document.getElementById('tab-' + tab).classList.add('nav-active');
    
    content.innerHTML = '<div class="flex justify-center py-20 animate-spin"><i data-lucide="loader-2" class="w-10 h-10 text-emerald-600"></i></div>';
    lucide.createIcons();

    if (tab === 'surat') {
        const { data } = await _supabase.from('pengajuan_surat').select('*').order('created_at', { ascending: false });
        content.innerHTML = `<h3 class="font-black text-xs mb-3 uppercase tracking-widest text-slate-400">Monitoring Surat Warga</h3>` + 
        (data.length ? data.map(s => `
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 mb-3 flex justify-between items-center shadow-sm">
                <div class="pr-2">
                    <span class="px-2 py-1 bg-emerald-100 text-emerald-700 text-[8px] font-black rounded-lg uppercase italic">${s.jenis_surat}</span>
                    <h4 class="font-black uppercase text-xs mt-2">${s.nama} <span class="text-slate-400">/ RT ${s.rt}</span></h4>
                    <p class="text-[10px] text-slate-500 italic mt-1 line-clamp-2">"${s.keterangan || 'Tidak ada catatan'}"</p>
                </div>
                <button onclick="window.open('https://wa.me/6281319934154')" class="bg-emerald-500 text-white p-4 rounded-2xl shadow-lg flex-shrink-0 active:bg-emerald-600"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
            </div>`).join('') : '<div class="p-10 text-center text-slate-400 text-xs font-bold">BELUM ADA PENGAJUAN</div>');

    } else if (tab === 'upload') {
        content.innerHTML = `
            <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm border-slate-100">
                <h3 class="font-black text-sm mb-5 uppercase flex items-center gap-2"><i data-lucide="plus-circle" class="text-emerald-500"></i> Upload Pengumuman</h3>
                <div class="space-y-4">
                    <div><label class="text-[10px] font-black ml-2 uppercase text-slate-400">Tipe Konten</label>
                    <select id="up-tipe" class="w-full mt-1 p-4 bg-slate-50 border-none rounded-2xl text-xs font-bold ring-1 ring-slate-100">
                        <option value="Kegiatan">Kegiatan (Absensi Aktif)</option>
                        <option value="Pengumuman">Pengumuman Biasa</option>
                        <option value="Agenda">Agenda Mendatang</option>
                    </select></div>
                    <input type="text" id="up-judul" placeholder="Judul Konten..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs ring-1 ring-slate-100 focus:ring-emerald-500">
                    <input type="date" id="up-tgl" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs ring-1 ring-slate-100">
                    <textarea id="up-isi" placeholder="Detail informasi untuk warga..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs ring-1 ring-slate-100" rows="4"></textarea>
                    <button onclick="simpanKonten()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all uppercase tracking-widest">Publikasikan Ke Warga</button>
                </div>
            </div>`;

    } else if (tab === 'dokumentasi') {
        content.innerHTML = `
            <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm border-slate-100 mb-6">
                <h3 class="font-black text-sm mb-5 uppercase flex items-center gap-2"><i data-lucide="camera" class="text-rose-500"></i> Upload Foto Kegiatan</h3>
                <div class="space-y-4">
                    <input type="text" id="doc-judul" placeholder="Nama Kegiatan..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs ring-1 ring-slate-100">
                    <input type="file" id="doc-file" accept="image/*" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs ring-1 ring-slate-100">
                    <button onclick="uploadFoto()" id="btn-upload-foto" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all">UPLOAD FOTO</button>
                </div>
            </div>
            <div id="gallery-preview" class="grid grid-cols-2 gap-3 pb-10"></div>`;
        loadGalleryPreview();

    } else if (tab === 'absen') {
        const { data: kegs } = await _supabase.from('pengumuman').select('judul').eq('tipe', 'Kegiatan');
        content.innerHTML = `<div class="bg-white p-6 rounded-[2.5rem] border shadow-sm">
            <h3 class="font-black text-sm mb-4 uppercase">Generate Laporan Absensi</h3>
            <p class="text-[10px] text-slate-400 mb-4 font-bold">Hasil download akan menyertakan KOP SURAT RW.01</p>
            <select id="pilih-kegiatan" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs font-bold mb-4 ring-1 ring-slate-100">
                <option value="">-- Pilih Nama Kegiatan --</option>
                ${kegs.map(k => `<option value="${k.judul}">${k.judul}</option>`).join('')}
            </select>
            <button onclick="downloadLaporan()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                <i data-lucide="download" class="w-4 h-4"></i> DOWNLOAD PDF
            </button>
        </div>`;

    } else if (tab === 'config') {
        content.innerHTML = `
            <div class="grid gap-4">
                <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm">
                    <h3 class="font-black text-[10px] mb-4 uppercase text-slate-400 tracking-widest italic">📢 Running Text Warga</h3>
                    <textarea id="set-running-text" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs font-bold ring-1 ring-slate-100" rows="3"></textarea>
                    <button onclick="saveConfig('running_text')" class="w-full mt-3 bg-emerald-600 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest">Update Running Text</button>
                </div>
                <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm">
                    <h3 class="font-black text-[10px] mb-4 uppercase text-slate-400 tracking-widest italic">📱 WhatsApp Admin Utama</h3>
                    <input type="tel" id="set-wa-admin" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-xs font-bold ring-1 ring-slate-100" placeholder="62812xxx">
                    <button onclick="saveConfig('wa_admin')" class="w-full mt-3 bg-emerald-600 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest">Simpan Nomor WA</button>
                </div>
            </div>`;
        loadCurrentConfig();
    }
    lucide.createIcons();
}

// LOGIKA UPLOAD DOKUMENTASI
// GANTI BAGIAN LOGIKA UPLOAD & DOWNLOAD DI ADMIN.HTML DENGAN INI

async function uploadFoto() {
    const fileInput = document.getElementById('doc-file');
    const judul = document.getElementById('doc-judul').value;
    const file = fileInput.files[0];
    const btn = document.getElementById('btn-upload-foto');

    if (!file || !judul) return alert("Pilih foto dan isi judul!");

    btn.disabled = true;
    btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> PROSES...`;
    lucide.createIcons();

    try {
        const fileName = `${Date.now()}_${file.name}`;
        // Gunakan bucket 'media-sinergi' agar sama dengan sisi warga
        const { data: uploadData, error: uploadError } = await _supabase.storage
            .from('media-sinergi')
            .upload('dokumentasi/' + fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = _supabase.storage.from('media-sinergi').getPublicUrl('dokumentasi/' + fileName);

        // Kolom disamakan menjadi 'file_url'
        const { error: dbError } = await _supabase.from('dokumentasi').insert([
            { judul: judul, file_url: urlData.publicUrl, created_at: new Date() }
        ]);

        if (dbError) throw dbError;

        alert("Foto terbit di galeri warga!");
        switchTab('dokumentasi');
    } catch (err) {
        alert("Gagal: " + err.message);
        btn.disabled = false;
        btn.innerText = "UPLOAD FOTO";
    }
}

async function loadGalleryPreview() {
    // Ambil data dari tabel dokumentasi
    const { data } = await _supabase.from('dokumentasi').select('*').order('created_at', { ascending: false });
    const container = document.getElementById('gallery-preview');
    if(data) {
        container.innerHTML = data.map(img => `
            <div class="bg-white p-2 rounded-3xl border border-slate-100 shadow-sm relative overflow-hidden group">
                <img src="${img.file_url}" class="w-full h-32 object-cover rounded-2xl">
                <div class="absolute bottom-2 left-2 right-2 p-2 bg-white/90 backdrop-blur rounded-xl border border-slate-100">
                    <p class="text-[8px] font-black uppercase truncate">${img.judul}</p>
                    <button onclick="deleteFoto('${img.id}')" class="text-[8px] text-rose-500 font-black mt-1 uppercase">Hapus Galeri</button>
                </div>
            </div>`).join('');
    }
}

// FUNGSI DOWNLOAD LAPORAN (DENGAN FOTO SELFIE & TTD)
async function downloadLaporan() {
    const keg = document.getElementById('pilih-kegiatan').value;
    if(!keg) return alert("Pilih kegiatan!");
    
    const { data } = await _supabase.from('absensi').select('*').eq('kegiatan_id', keg);
    if(!data.length) return alert("Belum ada data absensi.");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // KOP SURAT RW.01
    doc.setFontSize(14).setFont('helvetica', 'bold');
    doc.text("PENGURUS RUKUN WARGA 01 (RW.01)", 105, 15, { align: 'center' });
    doc.setFontSize(10).setFont('helvetica', 'normal');
    doc.text("Kelurahan Kebon Manggis, Matraman, Jakarta Timur", 105, 21, { align: 'center' });
    doc.setLineWidth(0.5).line(15, 25, 195, 25);

    doc.setFontSize(12).setFont('helvetica', 'bold');
    doc.text(`LAPORAN KEHADIRAN: ${keg.toUpperCase()}`, 15, 35);
    
    // TABEL UTAMA
    doc.autoTable({
        startY: 40,
        head: [['NAMA', 'RT', 'JABATAN', 'WAKTU', 'LOKASI']],
        body: data.map(r => [
            r.nama_warga.toUpperCase(), 
            r.rt, 
            r.jabatan, 
            new Date(r.waktu_absen).toLocaleString('id-ID'),
            r.lokasi || '-'
        ]),
        headStyles: { fillColor: [5, 150, 105] },
        styles: { fontSize: 8 }
    });
    
    doc.save(`Laporan_RW01_${keg}.pdf`);
}

// FUNGSI LAIN (TETAP SAMA)
async function simpanKonten() {
    const tipe = document.getElementById('up-tipe').value;
    const judul = document.getElementById('up-judul').value;
    const tgl = document.getElementById('up-tgl').value;
    const isi = document.getElementById('up-isi').value;
    if(!judul || !isi) return alert("Lengkapi data!");
    const { error } = await _supabase.from('pengumuman').insert([{ tipe, judul, tanggal: tgl, isi }]);
    if(!error) { alert("Konten Terbit!"); switchTab('upload'); }
}

async function loadCurrentConfig() {
    const { data } = await _supabase.from('app_config').select('*');
    data.forEach(item => {
        if(item.key === 'running_text') document.getElementById('set-running-text').value = item.value;
        if(item.key === 'wa_admin') document.getElementById('set-wa-admin').value = item.value;
    });
}

async function saveConfig(key) {
    const val = key === 'running_text' ? document.getElementById('set-running-text').value : document.getElementById('set-wa-admin').value;
    await _supabase.from('app_config').upsert({ key: key, value: val }, { onConflict: 'key' });
    alert("Update Berhasil!");
}

window.onload = () => {
    const u = JSON.parse(localStorage.getItem('user'));
    if(!u || u.role !== 'admin') location.href = 'index.html';
    switchTab('surat');
};
</script>
