<script>
// ============================================
// CONFIGURATION (Clean URLs)
// ============================================
const SB_URL = "https://ybuobehttmorjdiqwfta.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidW9iZWh0dG1vcmpkaXF3ZnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjQyMTMsImV4cCI6MjA4NzEwMDIxM30.dzdldaWRLjyTV-NK5LXZKxI2mK1MDYLHKRBXCDpMHPE";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

let signaturePad;

// ============================================
// UTILITY FUNCTIONS
// ============================================
function notify(msg, color = "bg-emerald-600") {
  const t = document.getElementById('toast');
  if(t) {
    t.textContent = msg; 
    t.className = 'fixed top-8 right-4 z-[999] px-6 py-3 rounded-xl shadow-2xl text-white font-bold animate-fade ' + color;
    t.classList.remove('hidden'); 
    setTimeout(function() { t.classList.add('hidden'); }, 3000);
  }
}

function showPage(id) {
  const pages = document.querySelectorAll('.page');
  for(let i = 0; i < pages.length; i++) {
    pages[i].classList.add('hidden');
  }
  const target = document.getElementById(id);
  if(target) {
    target.classList.remove('hidden');
  }
  if(window.lucide) {
    lucide.createIcons();
  }
}

// LOGIKA SUB-JABATAN
function updateSubJabatan() {
  const kat = document.getElementById('reg-kategori').value;
  const subContainer = document.getElementById('reg-sub-jabatan-container');
  const subSelect = document.getElementById('reg-sub-jabatan');
  const manualContainer = document.getElementById('reg-detail-manual-container');
  
  subContainer.classList.add('hidden');
  manualContainer.classList.add('hidden');
  subSelect.innerHTML = "";

  const options = {
    "Pengurus RW": ["Ketua RW", "Wakil 1 RW", "Wakil 2 RW", "Sekretaris 1 RW", "Sekretaris 2 RW", "Bendahara RW", "Seksi Humas", "Seksi Sosial"],
    "Pengurus RT": ["Ketua RT", "Sekretaris RT", "Bendahara RT"],
    "Kader": ["Dawis/PKK", "Jumantik", "Posyandu", "Dasawisma"],
    "Karang Taruna": ["Ketua", "Anggota"],
    "PAUD": ["Kepala Sekolah", "Guru"],
    "Keamanan": ["Kepala Keamanan", "Anggota"],
    "Kebersihan": ["Petugas Kebersihan", "Bank Sampah"]
  };

  if (options[kat]) {
    subContainer.classList.remove('hidden');
    options[kat].forEach(function(s) {
      const opt = document.createElement('option');
      opt.value = s; 
      opt.innerText = s;
      subSelect.appendChild(opt);
    });
  }
  
  if (kat !== "Warga") {
    manualContainer.classList.remove('hidden');
  }
}

// ============================================
// MAIN TABS LOGIC
// ============================================
async function switchTabWarga(tab) {
  const list = document.getElementById('user-content-area');
  const user = JSON.parse(localStorage.getItem('user'));
  
  const navItems = document.querySelectorAll('.nav-item');
  for(let i = 0; i < navItems.length; i++) {
    navItems[i].classList.remove('nav-active');
  }
  const activeNav = document.getElementById('nav-' + tab);
  if(activeNav) activeNav.classList.add('nav-active');
  
  list.innerHTML = '<div class="flex justify-center py-20"><div class="w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div></div>';

  try {
    if (tab === 'pengumuman') {
      const { data } = await _supabase.from('pengumuman').select('*').order('created_at', { ascending: false });
      if(data && data.length > 0) {
        list.innerHTML = data.map(function(i) {
          return '<div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden mb-6 animate-fade">' +
            (i.file_url && i.file_url !== '-' ? '<img src="' + i.file_url + '" class="w-full h-52 object-cover">' : '') +
            '<div class="p-6">' +
            '<div class="flex justify-between items-center mb-3 text-[8px] font-black uppercase">' +
            '<span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100">' + i.tipe + '</span>' +
            '<span class="text-slate-400">' + new Date(i.created_at).toLocaleDateString('id-ID') + '</span>' +
            '</div>' +
            '<h4 class="font-black text-lg uppercase leading-tight mb-3">' + i.judul + '</h4>' +
            '<p class="text-slate-500 text-xs mb-6">' + i.detail + '</p>' +
            (i.tipe === 'Kegiatan' ? '<button onclick="bukaAbsen(\'' + i.judul + '\')" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-emerald-100">Hadir di Lokasi</button>' : '') +
            '</div></div>';
        }).join('');
      } else {
        list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-slate-400 uppercase">Belum ada pengumuman</p>';
      }

    } else if (tab === 'dokumentasi') {
      // Ganti bagian loop dokumentasi dengan ini agar jumlah like muncul benar
const { data: docs } = await _supabase.from('dokumentasi').select('*').order('created_at', { ascending: false });
const { data: allLikes } = await _supabase.from('dokumentasi_likes').select('foto_id, username');

list.innerHTML = '<div class="grid grid-cols-2 gap-3">' +
  docs.map(function(img) {
    const fotoLikes = allLikes ? allLikes.filter(l => l.foto_id === img.id) : [];
    const isLiked = user && fotoLikes.some(l => l.username === user.username);
    
    return `
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 animate-fade">
        <div class="relative">
          <img src="${img.file_url || img.photo_url}" class="w-full h-40 object-cover">
          <button onclick="toggleLike('${img.id}', this)" class="absolute top-2 right-2 bg-white/90 backdrop-blur-md p-2 rounded-full shadow-lg transition-all active:scale-90">
            <i data-lucide="heart" class="w-4 h-4 ${isLiked ? 'fill-rose-500 text-rose-500' : 'text-slate-400'}"></i>
          </button>
          <div class="absolute bottom-2 left-2 bg-black/50 backdrop-blur-md px-2 py-1 rounded-full flex items-center gap-1">
            <span class="text-[10px] font-bold text-white" id="like-count-${img.id}">${fotoLikes.length}</span>
            <i data-lucide="heart" class="w-2 h-2 text-white fill-white"></i>
          </div>
        </div>
        <div class="p-3">
          <h5 class="text-[10px] font-black uppercase line-clamp-2 text-slate-700">${img.keterangan || img.judul}</h5>
        </div>
      </div>`;
  }).join('') + '</div>';

    } else if (tab === 'agenda') {
      const { data } = await _supabase.from('agenda').select('*').order('tanggal', { ascending: true });
      if(data && data.length > 0) {
        list.innerHTML = '<div class="space-y-4">' +
          data.map(function(ev) {
            return '<div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4 animate-fade">' +
              '<div class="bg-emerald-100 text-emerald-700 w-16 h-16 rounded-2xl flex flex-col items-center justify-center flex-shrink-0">' +
              '<span class="text-[9px] font-black uppercase">' + new Date(ev.tanggal).toLocaleString('id-ID', {month:'short'}) + '</span>' +
              '<span class="text-xl font-black leading-none">' + new Date(ev.tanggal).getDate() + '</span>' +
              '</div>' +
              '<div class="flex-1">' +
              '<h4 class="font-black text-sm uppercase leading-tight text-slate-800">' + ev.kegiatan + '</h4>' +
              '<div class="flex items-center gap-2 mt-2 text-[9px] text-slate-400 font-bold uppercase">' +
              '<span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ' + ev.jam + '</span>' +
              '<span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ' + ev.lokasi + '</span>' +
              '</div></div></div>';
          }).join('') +
          '</div>';
      } else {
        list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-slate-400 uppercase">Belum ada agenda</p>';
      }

    } else if (tab === 'pengajuan') {
      list.innerHTML = '<div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm animate-fade">' +
        '<h4 class="font-black text-lg uppercase mb-4 text-center">Pengajuan Surat Pengantar</h4>' +
        '<form onsubmit="kirimSurat(event)" class="space-y-4">' +
        '<select id="jenis-surat" class="w-full p-4 border-2 border-slate-50 bg-slate-50 rounded-2xl text-[10px] font-bold outline-none focus:border-emerald-500" required>' +
        '<option value="">-- Pilih Keperluan Surat --</option>' +
        '<option value="Surat Numpang Nikah">Surat Numpang Nikah</option>' +
        '<option value="Keterangan Kematian">Keterangan Kematian</option>' +
        '<option value="Keterangan Domisili">Keterangan Domisili</option>' +
        '<option value="Pengantar KK/KTP">Pengantar KK/KTP</option>' +
        '</select>' +

function bukaAbsen(judul) {
  document.getElementById('abs-kegiatan-id').value = async function toggleLike(fotoId, btnElement) {
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) return notify("Silakan login dahulu", "bg-rose-600");

  const icon = btnElement.querySelector('i');
  const countEl = document.getElementById('like-count-' + fotoId);
  let currentCount = parseInt(countEl.innerText) || 0;

  try {
    // 1. Cek apakah sudah di-like
    const { data: existing } = await _supabase
      .from('dokumentasi_likes')
      .select('id')
      .eq('foto_id', fotoId.toString()) // Pastikan string
      .eq('username', user.username)
      .maybeSingle();

    if (existing) {
      // 2. Jika sudah ada, hapus (Unlike)
      const { error } = await _supabase.from('dokumentasi_likes').delete().eq('id', existing.id);
      if (error) throw error;
      
      icon.classList.remove('fill-rose-500', 'text-rose-500');
      icon.classList.add('text-slate-400');
      countEl.innerText = Math.max(0, currentCount - 1);
    } else {
      // 3. Jika belum ada, tambah (Like)
      const { error } = await _supabase.from('dokumentasi_likes').insert({
        foto_id: fotoId.toString(),
        username: user.username
      });
      if (error) throw error;

      icon.classList.remove('text-slate-400');
      icon.classList.add('fill-rose-500', 'text-rose-500');
      countEl.innerText = currentCount + 1;
      
      // Animasi kecil
      btnElement.classList.add('scale-125');
      setTimeout(() => btnElement.classList.remove('scale-125'), 200);
    }
  } catch (err) {
    console.error("Detail Error:", err);
    notify("Gagal: Pastikan tabel likes sudah dibuat", "bg-rose-600");
  }
}

document.getElementById('form-submit-absen').onsubmit = async function(e) {
  e.preventDefault();
  const user = JSON.parse(localStorage.getItem('user'));
  const file = document.getElementById('abs-selfie').files[0];
  
  if(!file || signaturePad.isEmpty()) return notify("Foto Selfie dan TTD Wajib!", "bg-rose-500");
  
  notify("Mengirim Absensi...", "bg-blue-600");
  try {
    const fileName = 'absen_' + Date.now() + '.jpg';
    const { error: uploadError } = await _supabase.storage
      .from('media-sinergi')
      .upload('absen/' + fileName, file);
    
    if(uploadError) throw uploadError;
    
    const { data: dFoto } = _supabase.storage.from('media-sinergi').getPublicUrl('absen/' + fileName);
    
    const payload = {
      nama_warga: user.nama, 
      rt: user.rt, 
      jabatan: user.jabatan,
      waktu_absen: new Date().toISOString(),
      kegiatan_id: document.getElementById('abs-kegiatan-id').value,
      photo_selfie_url: dFoto.publicUrl,
      tanda_tangan_url: signaturePad.toDataURL()
    };
    
    const { error: insertError } = await _supabase.from('absensi').insert(payload);
    if(insertError) throw insertError;
    
    notify("Absensi Berhasil Terkirim ✓");
    document.getElementById('modal-absen').classList.add('hidden');
    switchTabWarga('riwayat');
  } catch (err) { 
    notify("Gagal Mengirim: " + err.message, "bg-rose-600"); 
  }
};

async function downloadRiwayat() {
  const user = JSON.parse(localStorage.getItem('user'));
  const { data } = await _supabase.from('absensi').select('*').eq('nama_warga', user.nama).order('waktu_absen', { ascending: false });
  
  if(!data || data.length === 0) return notify("Belum ada data untuk diunduh", "bg-rose-600");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14); doc.setFont("helvetica", "bold");
  doc.text("BUKTI KEHADIRAN WARGA", 105, 20, { align: "center" });
  doc.setFontSize(10); doc.text('Nama: ' + user.nama + ' (' + user.rt + ')', 105, 30, { align: "center" });
  
  const tableBody = data.map(function(row, index) {
    return [index + 1, row.kegiatan_id, new Date(row.waktu_absen).toLocaleString('id-ID')];
  });
  
  doc.autoTable({
    startY: 40,
    head: [['NO', 'KEGIATAN', 'WAKTU']],
    body: tableBody,
    theme: 'grid',
    headStyles: { fillColor: [5, 150, 105] }
  });
  
  doc.save('Riwayat_Absen_' + user.username + '.pdf');
  notify("PDF Diunduh!", "bg-emerald-600");
}

async function kirimSurat(e) {
  e.preventDefault();
  const user = JSON.parse(localStorage.getItem('user'));
  const jenis = document.getElementById('jenis-surat').value;
  const ket = document.getElementById('ket-surat').value;
  
  if(!jenis) return notify("Pilih jenis surat!", "bg-rose-600");
  
  notify("Mengirim Permohonan...", "bg-blue-600");
  
  try {
    const { data: suratData, error } = await _supabase
      .from('pengajuan_surat')
      .insert({
        nama: user.nama,
        rt: user.rt,
        hp: user.nomor_hp || '-',
        jenis_surat: jenis,
        keterangan: ket,
        status: 'Menunggu',
        waktu_pengajuan: new Date().toISOString()
      })
      .select()
      .single();
    
    if(error) throw error;
    
    const { data: settings } = await _supabase
      .from('settings')
      .select('value')
      .eq('key', 'admin_wa')
      .single();
    
    const adminWA = settings ? settings.value : '6285693456415';
    
    const pesan = '*PENGAJUAN SURAT BARU*%0A%0A' +
                  '👤 Nama: ' + user.nama + '%0A' +
                  '🏠 RT: ' + user.rt + '%0A' +
                  '📄 Jenis: ' + jenis + '%0A' +
                  '📝 Keterangan: ' + ket + '%0A%0A' +
                  'Mohon segera diproses. Terima kasih.';
    
    const confirmWA = confirm("Pengajuan terkirim! ✓%0A%0AIngin mengirim notifikasi WhatsApp ke Admin?");
    
    if(confirmWA) {
      const waLink = 'https://wa.me/' + adminWA + '?text=' + pesan;
      window.open(waLink, '_blank');
    }
    
    notify("Permohonan Terkirim!", "bg-emerald-600");
    switchTabWarga('pengumuman');
    
  } catch(err) {
    console.error(err);
    notify("Gagal mengirim: " + err.message, "bg-rose-600");
  }
}

async function loadRunningText() {
  try {
    const { data } = await _supabase.from('settings').select('value').eq('key', 'running_text').single();
    if(data) document.getElementById('running-text-val').innerText = data.value + ' • ';
  } catch(e) {}
}

function startClock() {
    setInterval(function() {
        const now = new Date();
        const clock = document.getElementById('live-clock');
        const dateEl = document.getElementById('live-date');
        if(clock) clock.innerText = now.toLocaleTimeString('id-ID', {hour12: false});
        if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'short', year:'numeric'});
    }, 1000);
}

window.onload = function() {
  const user = JSON.parse(localStorage.getItem('user'));
  if(user) {
    showPage('page-user');
    document.getElementById('kartu-nama').innerText = user.nama;
    document.getElementById('kartu-jabatan').innerText = user.jabatan;
    document.getElementById('kartu-rt').innerText = user.rt;
    startClock();
    loadRunningText();
    switchTabWarga('pengumuman');
  } else {
    showPage('page-login');
  }
  if(window.lucide) lucide.createIcons();
};

document.getElementById('form-login').onsubmit = async function(e) {
  e.preventDefault();
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  
  notify("Memverifikasi...", "bg-blue-600");
  
  // 1. CEK JIKA YANG LOGIN ADALAH ADMIN (Hardcoded seperti di admin.html)
  if (u === 'sekretaris' && p === 'adminrw01') {
    const adminData = {
      nama: "Admin Sekretariat",
      username: "sekretaris",
      role: "admin", // Kita tambahkan flag role
      rt: "RW 01",
      jabatan: "ADMIN SISTEM"
    };
    localStorage.setItem('user', JSON.stringify(adminData));
    notify("Login Admin Berhasil!", "bg-emerald-600");
    setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
    return;
  }

  // 2. CEK JIKA WARGA BIASA (Ke Supabase)
  try {
    const { data, error } = await _supabase
      .from('users')
      .select('*')
      .eq('username', u)
      .eq('password', p)
      .single();

    if (data) { 
      data.role = 'warga'; // Tambahkan flag role warga
      localStorage.setItem('user', JSON.stringify(data)); 
      notify("Login Berhasil!", "bg-emerald-600");
      setTimeout(() => { location.reload(); }, 1000); 
    } else { 
      notify("Username/Password Salah!", "bg-rose-600"); 
    }
  } catch (err) {
    notify("Terjadi kesalahan koneksi", "bg-rose-600");
  }
};


document.getElementById('form-register').onsubmit = async function(e) {
  e.preventDefault();
  
  // Ambil Nilai
  const nama = document.getElementById('reg-nama').value;
  const rt = document.getElementById('reg-rt').value;
  const hp = document.getElementById('reg-hp').value;
  const user = document.getElementById('reg-user').value.toLowerCase().trim(); // Kecilkan huruf
  const pass = document.getElementById('reg-pass').value;
  
  const rawJabatan = document.getElementById('reg-kategori').value;
  const subJab = document.getElementById('reg-sub-jabatan').value;
  const detMan = document.getElementById('reg-detail-manual').value;
  
  // Gabungkan Jabatan agar rapi
  let jabatanFinal = rawJabatan;
  if (rawJabatan !== "Warga" && subJab) {
    jabatanFinal = rawJabatan + " - " + subJab;
  }

  notify("Mengecek Username...", "bg-blue-600");

  try {
    // 1. CEK APAKAH USERNAME SUDAH TERPAKAI
    const { data: cekUser } = await _supabase
      .from('users')
      .select('username')
      .eq('username', user)
      .maybeSingle();

    if (cekUser) {
      notify("Username sudah terpakai! Cari yang lain.", "bg-rose-600");
      return;
    }

    // 2. PROSES DAFTAR
    const payload = {
      nama: nama,
      rt: rt,
      nomor_hp: hp,
      username: user,
      password: pass,
      jabatan: jabatanFinal,
      keterangan: detMan || "-",
      role: 'warga' // Tambahkan role default
    };

    const { error } = await _supabase.from('users').insert(payload);
    
    if(!error) { 
      notify("Pendaftaran Berhasil! Silakan Login.", "bg-emerald-600"); 
      setTimeout(function() { 
        e.target.reset(); // Kosongkan form
        showPage('page-login'); 
      }, 2000); 
    } else {
      throw error;
    }
  } catch (err) { 
    console.error(err);
    notify("Gagal Daftar: " + err.message, "bg-rose-600"); 
  }
};

function logout() { localStorage.clear(); location.reload(); }
