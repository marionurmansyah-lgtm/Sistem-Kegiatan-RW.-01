<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinergi RW.01 - Kebon Manggis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .btn-press:active { transform: scale(0.92); transition: 0.1s; }
        .nav-active { color: #059669 !important; transform: translateY(-5px); }
        .nav-active i { background: #f0fdf4; padding: 10px; border-radius: 16px; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); }
        .animate-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="pb-32">

<div id="app-container">
    <section id="page-login" class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
        <div class="w-full max-w-md bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100 animate-up">
            <div class="flex justify-center mb-8">
                <div class="p-4 bg-emerald-50 rounded-[2rem]">
                    <img src="https://ybuobehttmorjdiqwfta.supabase.co/storage/v1/object/public/Logo/1746898459176.png" class="w-16 h-16 object-contain" alt="Logo">
                </div>
            </div>
            <h1 class="text-center text-2xl font-extrabold tracking-tighter mb-1 uppercase">Sinergi RW.01</h1>
            <p class="text-center text-[10px] font-bold text-slate-400 tracking-[0.3em] mb-10 uppercase italic">Kebon Manggis Online</p>
            <form id="form-login" class="space-y-4">
                <input type="text" id="login-user" placeholder="Username" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-100 font-semibold" required>
                <input type="password" id="login-pass" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-100 font-semibold" required>
                <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold uppercase text-xs btn-press">Masuk</button>
                <button type="button" onclick="showPage('page-register')" class="w-full text-slate-400 font-bold text-[10px] uppercase mt-4">Daftar Akun Baru</button>
            </form>
        </div>
    </section>

    <section id="page-register" class="hidden min-h-screen p-6">
        <div class="w-full max-w-md mx-auto bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100 animate-up">
            <h2 class="text-xl font-extrabold mb-8 uppercase tracking-tighter">Registrasi</h2>
            <form id="form-register" class="space-y-4 text-sm font-semibold">
                <input type="text" id="reg-nama" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100" required>
                <div class="grid grid-cols-2 gap-3">
                    <select id="reg-rt" class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold" required>
                        <option value="">Pilih RT</option>
                        <script>for(let i=1;i<=16;i++) document.write(`<option value="RT ${String(i).padStart(2,'0')}">RT ${String(i).padStart(2,'0')}</option>`);</script>
                    </select>
                    <input type="tel" id="reg-hp" placeholder="WA (628...)" class="bg-slate-50 p-4 rounded-2xl border border-slate-100 font-bold">
                </div>
                <select id="reg-kategori" onchange="handleJabatanLengkap()" class="w-full bg-emerald-50 p-4 rounded-2xl text-emerald-800 border border-emerald-100 font-bold">
                    <option value="Warga">Warga</option>
                    <option value="Pengurus RW">Pengurus RW</option>
                    <option value="Pengurus RT">Pengurus RT</option>
                    <option value="Kader">Kader (PKK/Jumantik/Dawis)</option>
                    <option value="Karang Taruna">Karang Taruna</option>
                    <option value="PAUD">PAUD</option>
                    <option value="Keamanan">Keamanan</option>
                    <option value="Kebersihan">Kebersihan</option>
                </select>
                <div id="sub-jabatan-box" class="hidden animate-up">
                    <select id="reg-sub-jabatan" class="w-full p-4 border-2 border-emerald-500 rounded-2xl text-emerald-700 font-bold"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="reg-user" placeholder="Username" class="bg-slate-50 p-4 rounded-2xl border border-slate-100" required>
                    <input type="password" id="reg-pass" placeholder="Password" class="bg-slate-50 p-4 rounded-2xl border border-slate-100" required>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase text-xs btn-press">Daftar Akun</button>
                <button type="button" onclick="showPage('page-login')" class="w-full text-slate-400 text-center">Batal</button>
            </form>
        </div>
    </section>

    <section id="page-app" class="hidden">
        <header class="p-6 flex justify-between items-center sticky top-0 glass z-50">
            <div class="flex items-center gap-3">
                <img src="https://ybuobehttmorjdiqwfta.supabase.co/storage/v1/object/public/Logo/1746898459176.png" class="w-10 h-10 object-contain" alt="Logo">
                <div>
                    <h1 class="text-sm font-extrabold text-slate-800 uppercase leading-none">Sinergi 01</h1>
                    <p class="text-[9px] font-bold text-emerald-600 uppercase tracking-widest mt-1">Kebon Manggis</p>
                </div>
            </div>
            <button onclick="logout()" class="p-3 bg-white rounded-2xl shadow-sm btn-press">
                <i data-lucide="log-out" class="w-5 h-5 text-rose-500"></i>
            </button>
        </header>

        <main id="content-warga" class="p-6 max-w-2xl mx-auto"></main>

        <nav class="fixed bottom-6 left-6 right-6 glass rounded-[2.5rem] shadow-2xl p-4 z-50">
            <div class="flex justify-around items-center">
                <button onclick="switchTabWarga('home')" id="nav-home" class="flex flex-col items-center gap-1.5 text-slate-400 btn-press">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i><span class="text-[8px] font-bold">HOME</span>
                </button>
                <button onclick="switchTabWarga('agenda')" id="nav-agenda" class="flex flex-col items-center gap-1.5 text-slate-400 btn-press">
                    <i data-lucide="megaphone" class="w-5 h-5"></i><span class="text-[8px] font-bold">AGENDA</span>
                </button>
                <button onclick="switchTabWarga('dokumentasi')" id="nav-dokumentasi" class="flex flex-col items-center gap-1.5 text-slate-400 btn-press">
                    <i data-lucide="aperture" class="w-6 h-6"></i><span class="text-[8px] font-bold">GALERI</span>
                </button>
                <button onclick="switchTabWarga('surat')" id="nav-surat" class="flex flex-col items-center gap-1.5 text-slate-400 btn-press">
                    <i data-lucide="mail" class="w-5 h-5"></i><span class="text-[8px] font-bold">SURAT</span>
                </button>
                <button onclick="switchTabWarga('history')" id="nav-history" class="flex flex-col items-center gap-1.5 text-slate-400 btn-press">
                    <i data-lucide="file-check" class="w-5 h-5"></i><span class="text-[8px] font-bold">HISTORY</span>
                </button>
            </div>
        </nav>
    </section>

    <footer id="main-footer" class="py-10 flex flex-col items-center opacity-30">
        <p class="text-[9px] font-extrabold text-slate-500 tracking-[0.5em] uppercase italic">©2026 SEKRETARIAT RW.01</p>
    </footer>
</div>

<script>
const SB_URL = "https://ybuobehttmorjdiqwfta.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidW9iZWh0dG1vcmpkaXF3ZnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjQyMTMsImV4cCI6MjA4NzEwMDIxM30.dzdldaWRLjyTV-NK5LXZKxI2mK1MDYLHKRBXCDpMHPE";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

function showPage(id) {
    document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    lucide.createIcons();
}

function handleJabatanLengkap() {
    const k = document.getElementById('reg-kategori').value;
    const box = document.getElementById('sub-jabatan-box');
    const sub = document.getElementById('reg-sub-jabatan');
    box.classList.add('hidden');
    sub.innerHTML = "";
    
    const list = {
        "Pengurus RW": ["Ketua RW", "Sekretaris", "Bendahara", "Seksi Kebersihan", "Seksi Keamanan", "Seksi Pembangunan"],
        "Pengurus RT": ["Ketua RT", "Sekretaris RT", "Bendahara RT"],
        "Kader": ["PKK", "Jumantik", "Dasawisma", "Posyandu"],
        "Karang Taruna": ["Ketua", "Anggota"]
    };

    if(list[k]) {
        box.classList.remove('hidden');
        list[k].forEach(i => {
            const opt = document.createElement('option');
            opt.value = i; opt.text = i;
            sub.appendChild(opt);
        });
    }
}

async function handleLike(fotoId) {
    try {
        const user = JSON.parse(localStorage.getItem('user'));
        const { data: cek } = await _supabase.from('dokumentasi_likes').select('id').eq('foto_id', fotoId).eq('username', user.username).single();
        if(cek) {
            await _supabase.from('dokumentasi_likes').delete().eq('id', cek.id);
        } else {
            await _supabase.from('dokumentasi_likes').insert([{ foto_id: fotoId.toString(), username: user.username }]);
        }
        switchTabWarga('dokumentasi');
    } catch (e) { console.error(e); }
}

async function switchTabWarga(tab) {
    const container = document.getElementById('content-warga');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
    document.getElementById('nav-' + tab).classList.add('nav-active');
    container.innerHTML = `<div class="py-20 flex justify-center"><i data-lucide="loader-2" class="w-8 h-8 text-emerald-500 animate-spin"></i></div>`;
    lucide.createIcons();

    const user = JSON.parse(localStorage.getItem('user'));

    if (tab === 'home') {
        container.innerHTML = `
            <div class="mb-6 animate-up">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'})}</p>
                <h2 class="text-3xl font-black text-slate-800 tracking-tighter">${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</h2>
            </div>
            <div class="bg-slate-900 p-8 rounded-[3rem] text-white shadow-2xl animate-up relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-emerald-500/10 blur-[50px] rounded-full"></div>
                <p class="text-[10px] font-bold opacity-50 uppercase tracking-widest italic">Warga RW.01,</p>
                <h2 class="text-2xl font-extrabold mt-1 tracking-tight">${user.nama.toUpperCase()}</h2>
                <div class="mt-6 p-4 bg-white/5 rounded-2xl border border-white/10 flex items-center gap-3">
                    <div class="p-2 bg-emerald-500 rounded-xl"><i data-lucide="award" class="w-4 h-4"></i></div>
                    <span class="text-xs font-bold uppercase tracking-tight">${user.jabatan} - ${user.rt}</span>
                </div>
            </div>`;
    } 
    else if (tab === 'dokumentasi') {
        const { data: docs } = await _supabase.from('dokumentasi').select('*').order('created_at', {ascending:false});
        const { data: likes } = await _supabase.from('dokumentasi_likes').select('*');
        container.innerHTML = `<div class="space-y-8 animate-up">
            ${docs.map(img => {
                const count = likes ? likes.filter(l => l.foto_id == img.id.toString()).length : 0;
                return `
                <div class="bg-white rounded-[3rem] shadow-sm border border-slate-50 overflow-hidden">
                    <img src="${img.file_url}" class="w-full h-80 object-cover">
                    <div class="p-6 flex justify-between items-center">
                        <div>
                            <h4 class="font-extrabold text-xs uppercase tracking-tight">${img.judul}</h4>
                            <p class="text-[9px] text-slate-300 font-bold mt-1 uppercase">${new Date(img.created_at).toLocaleDateString()}</p>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="handleLike('${img.id}')" class="flex flex-col items-center btn-press">
                                <i data-lucide="heart" class="w-5 h-5 text-rose-500"></i>
                                <span class="text-[9px] font-black mt-1">${count}</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('')}
        </div>`;
    }
    else if (tab === 'surat') {
        container.innerHTML = `
            <div class="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100 animate-up">
                <h3 class="font-extrabold text-sm mb-6 uppercase tracking-tighter">Pengajuan Surat</h3>
                <div class="space-y-4">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Jenis Surat</label>
                    <input type="text" id="jenis-surat" placeholder="Contoh: Surat Pengantar Domisili" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 font-bold text-sm outline-none">
                    <button onclick="kirimSurat()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold uppercase text-xs btn-press flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Minta Tanda Tangan
                    </button>
                </div>
            </div>`;
    }
    else if (tab === 'history') {
        const { data } = await _supabase.from('absensi').select('*').eq('nama_warga', user.nama).order('waktu_absen', {ascending:false});
        container.innerHTML = `<div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden animate-up">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-100"><tr class="text-[10px] font-black text-slate-400 uppercase">
                    <th class="p-5">Kegiatan</th><th class="p-5 text-right">Waktu</th>
                </tr></thead>
                <tbody class="divide-y divide-slate-50 font-bold text-[10px]">
                    ${data.map(h => `<tr><td class="p-5 uppercase">${h.kegiatan_id}</td><td class="p-5 text-right text-slate-400">${new Date(h.waktu_absen).toLocaleString()}</td></tr>`).join('')}
                </tbody>
            </table>
        </div>`;
    }
    lucide.createIcons();
}

function kirimSurat() {
    const jenis = document.getElementById('jenis-surat').value;
    const user = JSON.parse(localStorage.getItem('user'));
    if(!jenis) return alert("Isi jenis surat!");
    const msg = encodeURIComponent(`Halo Admin RW.01, saya ${user.nama} (${user.rt}) ingin mengajukan: ${jenis}. Mohon bantuannya.`);
    window.open(`https://wa.me/628123456789?text=${msg}`, '_blank'); // Ganti nomor admin Anda
}

document.getElementById('form-login').onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById('login-user').value;
    const p = document.getElementById('login-pass').value;
    
    // Mengambil data user dari database
    const { data } = await _supabase.from('users').select('*').eq('username', u).eq('password', p).single();
    
    if(data) {
        localStorage.setItem('user', JSON.stringify(data));
        
        // --- LOGIKA PENGALIHAN OTOMATIS ---
        if(data.role === 'admin') {
            location.href = 'admin.html'; // Jika admin, lempar ke halaman admin
        } else {
            showPage('page-app'); // Jika warga, tetap di index.html dan buka aplikasi
            switchTabWarga('home');
        }
    } else {
        alert("Username atau Password Salah!");
    }
};


document.getElementById('form-register').onsubmit = async (e) => {
    e.preventDefault();
    const payload = {
        nama: document.getElementById('reg-nama').value,
        rt: document.getElementById('reg-rt').value,
        nomor_hp: document.getElementById('reg-hp').value,
        jabatan: document.getElementById('reg-sub-jabatan').value || "Warga",
        username: document.getElementById('reg-user').value,
        password: document.getElementById('reg-pass').value,
        role: 'warga'
    };
    const { error } = await _supabase.from('users').insert([payload]);
    if(!error) { alert("Berhasil!"); showPage('page-login'); }
};

function logout() { localStorage.clear(); location.reload(); }

window.onload = () => {
    const s = localStorage.getItem('user');
    if(s) { showPage('page-app'); switchTabWarga('home'); }
    else showPage('page-login');
};
</script>
</body>
</html>
