function notify(msg, color = "bg-emerald-600") {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'fixed top-8 right-4 z-[999] px-6 py-3 rounded-xl shadow-2xl text-white font-bold animate-fade ' + color;

function logout() { localStorage.clear(); location.reload(); }

// 1. FUNGSI LIKE
async function toggleLike(fotoId, btnElement) {
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) return notify("Login dahulu", "bg-rose-600");
  const icon = btnElement.querySelector('i');
  const countEl = document.getElementById('like-count-' + fotoId);
  try {
    const { data: existing } = await _supabase.from('dokumentasi_likes').select('id').eq('foto_id', fotoId.toString()).eq('username', user.username).maybeSingle();
    if (existing) {
      await _supabase.from('dokumentasi_likes').delete().eq('id', existing.id);
      icon.classList.remove('fill-rose-500', 'text-rose-500'); icon.classList.add('text-slate-400');
      countEl.innerText = Math.max(0, parseInt(countEl.innerText) - 1);
    } else {
      await _supabase.from('dokumentasi_likes').insert({ foto_id: fotoId.toString(), username: user.username });
      icon.classList.remove('text-slate-400'); icon.classList.add('fill-rose-500', 'text-rose-500');
      countEl.innerText = parseInt(countEl.innerText) + 1;
    }
  } catch (err) { console.error(err); }
}

// 2. TABS & CONTENT
async function switchTabWarga(tab) {
  const list = document.getElementById('user-content-area');
  const user = JSON.parse(localStorage.getItem('user'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
  document.getElementById('nav-' + tab).classList.add('nav-active');
  list.innerHTML = '<div class="flex justify-center py-20"><div class="w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div></div>';

  if (tab === 'pengumuman') {
    const { data } = await _supabase.from('pengumuman').select('*').order('created_at', { ascending: false });
    list.innerHTML = data.map(i => `<div class="bg-white rounded-[2rem] shadow-sm mb-6 p-4">
      ${i.file_url ? `<img src="${i.file_url}" class="w-full h-40 object-cover rounded-xl mb-3">` : ''}
      <h4 class="font-black uppercase">${i.judul}</h4><p class="text-xs text-slate-500">${i.detail}</p>
      ${i.tipe === 'Kegiatan' ? `<button onclick="bukaAbsen('${i.judul}')" class="w-full mt-3 bg-emerald-600 text-white py-3 rounded-xl font-black text-[10px]">HADIR</button>` : ''}
    </div>`).join('');
  } else if (tab === 'dokumentasi') {
    const { data: docs } = await _supabase.from('dokumentasi').select('*').order('created_at', { ascending: false });
    const { data: lks } = await _supabase.from('dokumentasi_likes').select('foto_id, username');
    list.innerHTML = `<div class="grid grid-cols-2 gap-3">${docs.map(img => {
      const fLks = lks ? lks.filter(l => l.foto_id === img.id.toString()) : [];
      const isL = user && fLks.some(l => l.username === user.username);
      return `<div class="bg-white rounded-2xl overflow-hidden shadow-sm border p-1 relative">
        <img src="${img.file_url}" class="w-full h-32 object-cover rounded-xl">
        <button onclick="toggleLike('${img.id}', this)" class="absolute top-3 right-3 bg-white/80 p-2 rounded-full shadow-lg">
          <i data-lucide="heart" class="w-4 h-4 ${isL ? 'fill-rose-500 text-rose-500' : 'text-slate-400'}"></i>
        </button>
        <div class="p-2"><span id="like-count-${img.id}" class="text-[10px] font-bold">${fLks.length}</span> <span class="text-[10px]">Suka</span></div>
      </div>`;
    }).join('')}</div>`;
  } else if (tab === 'agenda') {
    const { data } = await _supabase.from('agenda').select('*').order('tanggal', { ascending: true });
    list.innerHTML = data.map(ev => `<div class="bg-white p-4 rounded-2xl mb-3 border flex gap-4">
      <div class="bg-emerald-100 p-3 rounded-xl text-center"><b>${new Date(ev.tanggal).getDate()}</b></div>
      <div><h4 class="font-black text-xs uppercase">${ev.kegiatan}</h4><p class="text-[10px] text-slate-400">${ev.lokasi}</p></div>
    </div>`).join('');
  } else if (tab === 'pengajuan') {
    list.innerHTML = `<div class="bg-white p-6 rounded-[2rem] border">
      <h4 class="font-black uppercase text-center mb-4">Pengajuan Surat</h4>
      <form onsubmit="kirimSurat(event)" class="space-y-3">
        <select id="jenis-surat" class="w-full p-3 bg-slate-50 rounded-xl text-xs font-bold" required>
          <option value="Keterangan Domisili">Keterangan Domisili</option>
          <option value="Pengantar KTP/KK">Pengantar KTP/KK</option>
          <option value="Numpang Nikah">Numpang Nikah</option>
        </select>
        <textarea id="ket-surat" class="w-full p-3 bg-slate-50 rounded-xl text-xs" placeholder="Keterangan tambahan..."></textarea>
        <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black">KIRIM KE ADMIN</button>
      </form></div>`;
  } else if (tab === 'riwayat') {
    const { data } = await _supabase.from('absensi').select('*').eq('nama_warga', user.nama).order('waktu_absen', { ascending: false });
    list.innerHTML = `<div class="flex justify-between items-center mb-4"><h4 class="font-black text-xs">RIWAYAT ABSEN</h4><button onclick="downloadRiwayat()" class="text-[10px] bg-emerald-100 px-3 py-1 rounded-lg">PDF</button></div>
      <div class="space-y-3">${data.map(r => `<div class="bg-white p-3 rounded-xl border text-xs flex justify-between">
        <span>${r.kegiatan_id}</span><span class="text-slate-400">${new Date(r.waktu_absen).toLocaleDateString()}</span>
      </div>`).join('')}</div>`;
  }
  lucide.createIcons();
}

// 3. ABSENSI & PDF & SURAT (WA ADMIN BALIK LAGI)
function bukaAbsen(j) {
  document.getElementById('abs-kegiatan-id').value = j;
  document.getElementById('modal-absen').classList.remove('hidden');
  const c = document.getElementById('canvas-ttd'); c.width = c.offsetWidth;
  signaturePad = new SignaturePad(c);
}

document.getElementById('form-submit-absen').onsubmit = async function(e) {
  e.preventDefault();
  const u = JSON.parse(localStorage.getItem('user'));
  const f = document.getElementById('abs-selfie').files[0];
  if(!f || signaturePad.isEmpty()) return notify("Data tidak lengkap", "bg-rose-500");
  notify("Mengirim...");
  try {
    const nm = 'absen_' + Date.now() + '.jpg';
    await _supabase.storage.from('media-sinergi').upload('absen/' + nm, f);
    const { data: pf } = _supabase.storage.from('media-sinergi').getPublicUrl('absen/' + nm);
    await _supabase.from('absensi').insert({
      nama_warga: u.nama, rt: u.rt, jabatan: u.jabatan,
      kegiatan_id: document.getElementById('abs-kegiatan-id').value,
      photo_selfie_url: pf.publicUrl, tanda_tangan_url: signaturePad.toDataURL(),
      waktu_absen: new Date().toISOString()
    });
    notify("Berhasil!"); document.getElementById('modal-absen').classList.add('hidden');
    switchTabWarga('riwayat');
  } catch (err) { notify("Gagal!", "bg-rose-600"); }
};

async function downloadRiwayat() {
  const user = JSON.parse(localStorage.getItem('user'));
  const { data } = await _supabase.from('absensi').select('*').eq('nama_warga', user.nama);
  const { jsPDF } = window.jspdf; const doc = new jsPDF();
  doc.text("RIWAYAT ABSENSI - " + user.nama, 10, 10);
  doc.autoTable({ head: [['Kegiatan', 'Waktu']], body: data.map(r => [r.kegiatan_id, r.waktu_absen]) });
  doc.save('Absensi.pdf');
}

// FITUR WA ADMIN
async function kirimSurat(e) {
  e.preventDefault();
  const user = JSON.parse(localStorage.getItem('user'));
  const jns = document.getElementById('jenis-surat').value;
  const ket = document.getElementById('ket-surat').value;
  
  notify("Mengirim...");
  const { error } = await _supabase.from('pengajuan_surat').insert({
    nama: user.nama, rt: user.rt, jenis_surat: jns, keterangan: ket, status: 'Menunggu'
  });
  
  if(!error) {
    const pesan = `Halo Admin, saya mengajukan surat:%0A%0ANama: ${user.nama}%0ART: ${user.rt}%0AJenis: ${jns}%0AKet: ${ket}`;
    const waLink = `https://wa.me/6281319934154?text=${pesan}`;
    if(confirm("Pengajuan terkirim. Lanjut kirim WhatsApp ke Admin?")) {
        window.open(waLink, '_blank');
    }
    notify("Berhasil!"); switchTabWarga('pengumuman');
  } else {
    notify("Gagal simpan data", "bg-rose-600");
  }
}

    nomor_hp: document.getElementById('reg-hp').value, username: document.getElementById('reg-user').value,
    password: document.getElementById('reg-pass').value, jabatan: document.getElementById('reg-kategori').value,
    role: 'warga'
  };
  const { error } = await _supabase.from('users').insert(pl);
  if(!error) { notify("Sukses!"); showPage('page-login'); }
  else notify("Gagal!", "bg-rose-600");
};

function updateSubJabatan() {
  const k = document.getElementById('reg-kategori').value;
  const s = document.getElementById('reg-sub-jabatan');
  const c = document.getElementById('reg-sub-jabatan-container');
  c.classList.add('hidden'); s.innerHTML = "";
  if(k === "Pengurus RW") {
    c.classList.remove('hidden');
    ["Ketua RW", "Sekretaris", "Bendahara"].forEach(i => { const o = document.createElement('option'); o.value=i; o.text=i; s.appendChild(o); });
  }
}

window.onload = function() {
  const user = JSON.parse(localStorage.getItem('user'));
  if(user) {
    showPage('page-user');
    document.getElementById('kartu-nama').innerText = user.nama;
    document.getElementById('kartu-rt').innerText = user.rt || 'RW 01';
    document.getElementById('kartu-jabatan').innerText = user.jabatan || 'Warga';
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('id-ID');
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'short'});
    }, 1000);
    switchTabWarga('pengumuman');
  } else { showPage('page-login'); }
};
</script>
</body>
</html>
