                } else if(tab === 'agenda') {
    const res = await fetch(`${SHEETDB_URL}?sheet=agenda`);
    const allEvents = await res.json();
    
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();
    const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    // Render Container Kalender
    list.innerHTML = `
        <div class="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm animate-fade">
            <div class="flex justify-between items-center mb-4">
                <h4 class="font-black text-xs uppercase text-emerald-800">${monthNames[currentMonth]} ${currentYear}</h4>
                <div class="flex gap-2">
                    <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-emerald-500"></div><span class="text-[7px] font-bold text-slate-400 uppercase">Agenda</span></div>
                </div>
            </div>
            <div class="calendar-grid text-center mb-2">
                ${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d => `<div class="text-[8px] font-black text-slate-300 uppercase">${d}</div>`).join('')}
            </div>
            <div id="calendar-days" class="calendar-grid"></div>
        </div>
        <div id="event-details" class="space-y-3 mt-4">
            <p class="text-center py-10 text-[9px] font-black text-slate-300 uppercase tracking-widest">Pilih tanggal yang ditandai</p>
        </div>
    `;

    const calDays = document.getElementById('calendar-days');
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    // Buat grid tanggal
    for(let i=0; i<firstDay; i++) calDays.innerHTML += `<div></div>`;
    
    for(let day=1; day<=daysInMonth; day++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const hasEvent = allEvents.find(e => e.tanggal === dateStr);
        const isToday = day === now.getDate() ? 'border-2 border-emerald-200' : '';
        
        const dayEl = document.createElement('div');
        dayEl.className = `calendar-day ${hasEvent ? 'day-has-event' : 'day-active'} ${isToday}`;
        dayEl.innerHTML = `${day} ${hasEvent ? '<div class="event-dot"></div>' : ''}`;
        
        dayEl.onclick = () => {
            document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('day-selected'));
            dayEl.classList.add('day-selected');
            showEventDetail(hasEvent);
        };
        calDays.appendChild(dayEl);
    }

    // Fungsi menampilkan card saat tanggal diklik
    function showEventDetail(event) {
        const detailCont = document.getElementById('event-details');
        if(!event) {
            detailCont.innerHTML = `<div class="bg-slate-50 p-6 rounded-3xl text-center border-2 border-dashed border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase">Tidak ada agenda di tanggal ini</p>
            </div>`;
            return;
        }
        detailCont.innerHTML = `
            <div class="bg-white p-5 rounded-[2rem] border-2 border-emerald-100 shadow-md animate-fade">
                <div class="flex items-center gap-3 mb-3">
                    <div class="bg-emerald-100 text-emerald-600 p-2 rounded-xl"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                    <div>
                        <p class="text-[8px] font-black text-emerald-600 uppercase">Agenda Kegiatan</p>
                        <h4 class="font-black text-sm uppercase text-slate-800 leading-tight">${event.kegiatan}</h4>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-50">
                    <div class="flex items-center gap-2">
                        <i data-lucide="clock" class="w-3 h-3 text-slate-400"></i>
                        <span class="text-[9px] font-bold text-slate-500 uppercase">${event.jam}</span>
                    </div>
                    <div class="flex items-center gap-2 text-right justify-end">
                        <i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i>
                        <span class="text-[9px] font-bold text-slate-500 uppercase truncate">${event.lokasi}</span>
                    </div>
                </div>
            </div>
        `;
        lucide.createIcons();
    }
    lucide.createIcons();
}

                } else if(tab === 'pengajuan') {
                    list.innerHTML = `<div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm animate-fade">
                            <div class="text-center mb-6">
                                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-2"><i data-lucide="file-text"></i></div>
                                <h4 class="font-black text-sm uppercase text-slate-800">Pengajuan Surat Pengantar</h4>
                                <p class="text-[9px] text-slate-400 font-bold uppercase">RW.01 Kebon Manggis</p>
                            </div>
                            <form id="form-surat" class="space-y-4">
                                <select id="jenis-surat" class="w-full p-4 border-2 border-slate-50 bg-slate-50 rounded-2xl text-[10px] font-bold outline-none focus:border-emerald-500">
                                    <option value="">-- Pilih Keperluan Surat --</option>
                                    <option value="Surat Numpang Nikah">Surat Numpang Nikah</option>
                                    <option value="Keterangan Kematian">Keterangan Kematian</option>
                                    <option value="Keterangan Domisili">Keterangan Domisili</option>
                                    <option value="Pengantar KK/KTP">Pengantar KK/KTP</option>
                                    <option value="Keterangan Tidak Mampu">Keterangan Tidak Mampu (SKTM)</option>
                                </select>
                                <textarea id="ket-surat" placeholder="Tuliskan alasan atau keterangan tambahan lainnya secara singkat..." class="w-full p-4 border-2 border-slate-50 bg-slate-50 rounded-2xl text-[10px] outline-none h-28 focus:border-emerald-500"></textarea>
                                <button type="button" onclick="kirimPengajuanSurat()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg active:scale-95 transition-all">Kirim Permohonan</button>
                            </form>
                        </div>`;
                } else if(tab === 'riwayat') {
                    const res = await fetch(`${SHEETDB_URL}?sheet=absen`);
                    const allData = await res.json();
                    const myAbsen = allData.filter(a => a.nama_warga === user.nama);
                    list.innerHTML = `
                        <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm mb-4 text-center">
                            <div id="qrcode" class="flex justify-center mb-3"></div>
                            <p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest">Citizen ID: ${user.username}</p>
                            <p class="text-[7px] text-slate-300 uppercase mt-1">Gunakan QR ini untuk verifikasi petugas</p>
                        </div>
                        <h5 class="text-[10px] font-black uppercase text-slate-400 mb-3 px-2 flex items-center gap-2"><i data-lucide="check-circle" class="w-3 h-3 text-emerald-500"></i> Riwayat Kehadiran Anda</h5>
                        <div class="space-y-3">
                        ${myAbsen.reverse().map(r => `
                            <div class="bg-white p-4 rounded-3xl border border-slate-50 shadow-sm flex items-center gap-4">
                                <img src="${r.photo_selfie_url}" onclick="viewImage('${r.photo_selfie_url}', 'Bukti Selfie')" class="w-14 h-14 object-cover rounded-2xl border-2 border-emerald-50 cursor-pointer">
                                <div class="flex-1">
                                    <p class="font-black text-[10px] uppercase text-slate-800 leading-tight">${r.kegiatan_id}</p>
                                    <p class="text-[8px] text-slate-400 font-bold mt-1 uppercase">${r.waktu_absen}</p>
                                </div>
                                <img src="${r.tanda_tangan_url}" onclick="viewImage('${r.tanda_tangan_url}', 'Bukti TTD')" class="w-10 h-10 object-contain bg-slate-50 rounded-lg p-1 cursor-pointer">
                            </div>`).join('')}
                        </div>`;
                    new QRCode(document.getElementById("qrcode"), { text: user.username, width: 120, height: 120, colorDark : "#065f46" });
                }
            } catch (e) { 
                list.innerHTML = '<div class="text-center py-20 text-rose-500 font-bold uppercase text-[10px]">Gagal memuat data. Periksa internet Anda.</div>'; 
            }
            lucide.createIcons();
        }

        // AUTH LOGIC (DIPERBAIKI)
        document.getElementById('form-login').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if (u === 'sekretaris' && p === 'adminrw01') {
                localStorage.setItem('user', JSON.stringify({nama:"Admin RW", jabatan:"Admin", username:"sekretaris", rt:"01"}));
                window.location.href = 'admin.html'; return;
            }


            


            
            notify("Memverifikasi Akun...", "bg-blue-600");
            try {
                const res = await fetch(`${SHEETDB_URL}?sheet=users`);
                const data = await res.json();
                const user = data.find(x => x.username === u && x.password === p);
                if(user) {
                    localStorage.setItem('user', JSON.stringify(user));
                    user.jabatan === 'Admin' ? window.location.href='admin.html' : location.reload();
                } else { notify("Username/Password Salah!", "bg-rose-600"); }
            } catch (err) { notify("Kesalahan Server", "bg-rose-600"); }
        };

        document.getElementById('form-register').onsubmit = async (e) => {
            e.preventDefault();
            const rawJabatan = document.getElementById('reg-kategori').value;
            const subJab = document.getElementById('reg-sub-jabatan').value;
            const detMan = document.getElementById('reg-detail-manual').value;
            
            const payload = {
                nama: document.getElementById('reg-nama').value,
                rt: document.getElementById('reg-rt').value,
                nomor_hp: document.getElementById('reg-hp').value,
                username: document.getElementById('reg-user').value,
                password: document.getElementById('reg-pass').value,
                jabatan: subJab ? `${rawJabatan} (${subJab})` : rawJabatan,
                keterangan: detMan || "-"
            };
            
            notify("Mendaftarkan...", "bg-blue-600");
            try {
                const res = await fetch(`${SHEETDB_URL}?sheet=users`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({data: [payload]})
                });
                if(res.ok) { notify("Pendaftaran Berhasil!"); setTimeout(()=>showPage('page-login'), 1500); }
            } catch (err) { notify("Gagal Daftar!", "bg-rose-600"); }
        };

        // ZOOM LOGIC
        function toggleZoom(el) {
            if (el.style.transform === "scale(2)") {
                el.style.transform = "scale(1)";
                el.classList.replace('cursor-zoom-out', 'cursor-zoom-in');
            } else {
                el.style.transform = "scale(2)";
                el.classList.replace('cursor-zoom-in', 'cursor-zoom-out');
            }
        }

        function viewImage(url, caption) {
            const img = document.getElementById('full-image');
            img.src = url; img.style.transform = "scale(1)";
            document.getElementById('image-caption').innerText = caption;
            document.getElementById('image-viewer').classList.remove('hidden');
            document.getElementById('image-viewer').classList.add('flex');
            lucide.createIcons();
        }

        function closeImageViewer() { document.getElementById('image-viewer').classList.add('hidden'); }

        function bukaAbsen(judul) {
            document.getElementById('abs-kegiatan-id').value = judul;
            document.getElementById('modal-absen').classList.remove('hidden');
            const canvas = document.getElementById('canvas-ttd');
            canvas.width = canvas.offsetWidth;
            signaturePad = new SignaturePad(canvas);
        }

        document.getElementById('form-submit-absen').onsubmit = async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('user'));
            const file = document.getElementById('abs-selfie').files[0];
            if(!file || signaturePad.isEmpty()) return alert("Foto Selfie dan TTD Wajib!");
            
            notify("Mengirim Absensi...", "bg-blue-600");
            try {
                const fileName = `absen_${Date.now()}.jpg`;
                await _supabase.storage.from('media-sinergi').upload(`absen/${fileName}`, file);
                const { data: dFoto } = _supabase.storage.from('media-sinergi').getPublicUrl(`absen/${fileName}`);
                
                const payload = {
                    nama_warga: user.nama, rt: user.rt, jabatan: user.jabatan,
                    waktu_absen: new Date().toLocaleString('id-ID'),
                    kegiatan_id: document.getElementById('abs-kegiatan-id').value,
                    photo_selfie_url: dFoto.publicUrl, 
                    tanda_tangan_url: signaturePad.toDataURL()
                };
                
                await fetch(`${SHEETDB_URL}?sheet=absen`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({data: [payload]})
                });
                
                notify("Absensi Berhasil Terkirim ✓");
                document.getElementById('modal-absen').classList.add('hidden');
                switchTabWarga('riwayat');
            } catch (err) { notify("Gagal Mengirim!", "bg-rose-600"); }
        };

        async function kirimPengajuanSurat() {
            const user = JSON.parse(localStorage.getItem('user'));
            const jenis = document.getElementById('jenis-surat').value;
            if(!jenis) return alert("Pilih jenis surat!");
            notify("Mengirim Permohonan...", "bg-blue-600");
            try {
                const payload = {
                    nama: user.nama, rt: user.rt, hp: user.nomor_hp || "-", 
                    jenis_surat: jenis, keterangan: document.getElementById('ket-surat').value || "-",
                    status: "Menunggu", waktu_pengajuan: new Date().toLocaleString('id-ID')
                };
                await fetch(`${SHEETDB_URL}?sheet=pengajuan`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({data: [payload]})
                });
                notify("Pengajuan Terkirim ✓");
                switchTabWarga('pengumuman');
            } catch (err) { notify("Gagal Mengirim!", "bg-rose-600"); }
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user) {
                if(user.jabatan === 'Admin') { window.location.href = 'admin.html'; }
                else {
                    showPage('page-user');
                    document.getElementById('kartu-nama').innerText = user.nama;
                    document.getElementById('kartu-jabatan').innerText = user.jabatan;
                    document.getElementById('kartu-rt').innerText = user.rt;
                    loadRunningText();
                    switchTabWarga('pengumuman');
                }
            }
            lucide.createIcons();
        };
    </script>
