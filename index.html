<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
* { -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', sans-serif; overflow-x: hidden; background: #f8fafc; }
.page { min-height: 100vh; }
.animate-fade { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
canvas { border: 2px dashed #cbd5e1; background: #f8fafc; border-radius: 1rem; width: 100%; height: 150px; touch-action: none; }

.running-text-container { background: #fef3c7; overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 36px; border-bottom: 1px solid #fde68a; }
.running-text-content { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; font-size: 11px; font-weight: 800; color: #78350f; text-transform: uppercase; letter-spacing: 0.5px; }
@keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
.nav-active { color: #059669 !important; font-weight: 900; }
.nav-active i { transform: translateY(-3px); transition: 0.2s; }
.cursor-zoom-in { cursor: zoom-in; }
.cursor-zoom-out { cursor: zoom-out; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border-radius: 12px; cursor: pointer; position: relative; background: #f1f5f9; color: #64748b; transition: 0.2s; }
.day-has-event { background: #ecfdf5; color: #059669; border: 1px solid #10b981; }
.day-selected { background: #059669 !important; color: white !important; transform: scale(1.1); z-index: 10; }
.event-dot { width: 4px; height: 4px; background: #10b981; border-radius: 50%; position: absolute; bottom: 4px; }
#toast { transition: all 0.3s ease; }
.footer-credit { opacity: 0.5; transition: 0.3s; }
.footer-credit:hover { opacity: 1; }

/* ✅ ANIMASI EVENT DOT - PULSING EFFECT */
.event-dot {
  width: 6px;
  height: 6px;
  background: #FF6D2D;
  border-radius: 50%;
  position: absolute;
  bottom: 10px;
  animation: pulse-dot 2s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
}

/* ✅ ANIMASI PULSING */
@keyframes pulse-dot {
  0% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  }
  50% {
    transform: scale(1.1);
    box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
  }
  100% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
  }
}

/* ✅ ANIMASI BACKGROUND UNTUK TANGGAL BERAGENDA */
.day-has-event {
  background: #ecfdf5 !important;
  color: #059669 !important;
  border: 2px solid #FF6D2D !important;
  animation: highlight-event 3s ease-in-out infinite;
}

@keyframes highlight-event {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
  }
  50% {
    box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
  }
}

/* ✅ ANIMASI SAAT HOVER TANGGAL BERAGENDA */
.day-has-event:hover {
  transform: scale(1.15);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  z-index: 5;
}

/* ✅ ANIMASI KALENDER CONTAINER */
.calendar-grid {
  animation: fadeIn 0.5s ease-out;
}

<script>
// ============================================
// CONFIG
// ============================================
const SB_URL = "https://kbzlgrpeerllbvpiyhpf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiemxncnBlZXJsbGJ2cGl5aHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDY2NTksImV4cCI6MjA4NzUyMjY1OX0.8n4lPZs9t6Zo4Wk5TmdcEt1wqpa7_CeGH9EdM-WKX2w";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

const TABLES = {
  USERS: 'users',
  PENGUMUMAN: 'pengumuman',
  ABSENSI: 'absensi',
  AGENDA: 'agenda',
  DOKUMENTASI: 'dokumentasi',
  PENGAJUAN: 'pengajuan_surat',
  SETTINGS: 'settings'
};

let signaturePad;

// ============================================
// UTILITY FUNCTIONS
// ============================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  lucide.createIcons();
}

function togglePass(id) {
  const el = document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
  lucide.createIcons();
}

function notify(msg, color = "bg-emerald-600") {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed top-8 right-4 z-[999] px-6 py-3 rounded-xl text-white font-bold animate-fade ${color}`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

function updateLiveTime() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if(document.getElementById('live-clock')) document.getElementById('live-clock').innerText = timeStr;
  if(document.getElementById('live-date')) document.getElementById('live-date').innerText = dateStr;
}
setInterval(updateLiveTime, 1000);

// ============================================
// SUB-JABATAN LOGIC
// ============================================
function updateSubJabatan() {
  const kat = document.getElementById('reg-kategori').value;
  const subCont = document.getElementById('reg-sub-jabatan-container');
  const sub = document.getElementById('reg-sub-jabatan');
  const detCont = document.getElementById('reg-detail-manual-container');
  
  subCont.classList.add('hidden');
  detCont.classList.add('hidden');
  sub.innerHTML = '';
  
  if (kat === 'Pengurus RW') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="Ketua RW">Ketua RW</option><option value="Wakil Ketua RW">Wakil Ketua RW</option><option value="Sekretaris RW">Sekretaris RW</option><option value="Bendahara RW">Bendahara RW</option>';
  } else if (kat === 'Pengurus RT') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="Ketua RT">Ketua RT</option><option value="Sekretaris RT">Sekretaris RT</option><option value="Bendahara RT">Bendahara RT</option>';
  } else if (kat === 'Kader') {
    subCont.classList.remove('hidden');
    detCont.classList.remove('hidden');
    sub.innerHTML = '<option value="PKK">Kader PKK</option><option value="Jumantik">Kader Jumantik</option><option value="DAWIS">Kader DAWIS</option><option value="Posyandu">Kader Posyandu</option>';
  } else if (kat === 'Seksi Pendidikan') {
    subCont.classList.remove('hidden');
    detCont.classList.remove('hidden');
    sub.innerHTML = '<option value="PAUD">Guru PAUD</option><option value="Guru Ngaji">Guru Ngaji</option>';
  } else if (kat === 'Keamanan') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="Kordinator Keamanan">Kordinator Keamanan</option><option value="Anggota Keamanan">Anggota Keamanan</option>';
  } else if (kat === 'Kebersihan') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="Petugas Kebersihan">Petugas Kebersihan</option><option value="Petugas Bank Sampah">Petugas Bank Sampah</option>';
  } else if (kat === 'Karang Taruna') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="KETUA">KETUA</option><option value="ANGGOTA">ANGGOTA</option>';
  }
  
  lucide.createIcons();
}

// ============================================
// RUNNING TEXT
// ============================================
async function loadRunningText() {
  try {
    const { data, error } = await _supabase
      .from(TABLES.SETTINGS)
      .select('value')
      .eq('key', 'running_text')
      .single();
    
    if(data && !error) document.getElementById('running-text-val').innerText = data.value + " • ";
  } catch(e) {}
}

// ============================================
// NAVIGATION WARGA
// ============================================
async function switchTabWarga(tab) {
  const list = document.getElementById('user-content-area');
  const user = JSON.parse(localStorage.getItem('user'));
  
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
  if(document.getElementById(`nav-${tab}`)) document.getElementById(`nav-${tab}`).classList.add('nav-active');
  
  list.innerHTML = '<div class="flex flex-col items-center justify-center py-20 gap-3"><div class="w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Sinkronisasi Data...</p></div>';
  lucide.createIcons();
  
  try {
    if(tab === 'pengumuman') {
      const { data, error } = await _supabase
        .from(TABLES.PENGUMUMAN)
        .select('*')
        .order('created_at', { ascending: false });

// PDF GENERATOR - FIXED (PARAF COLUMN ONLY)
// ============================================
async function generateLaporanPDF() {
  notify("Menyiapkan Dokumen...", "bg-blue-600");
  
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // === 1. LOAD LOGO ===
    const logoUrl = "https://kbzlgrpeerllbvpiyhpf.supabase.co/storage/v1/object/public/Logo/1746898459176.png";
    
    const loadImage = (url) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    };
    
    const logoBase64 = await loadImage(logoUrl);
    
    // === 2. AMBIL DATA ABSENSI ===
    const { data, error } = await _supabase
      .from(TABLES.ABSENSI)
      .select('*')
      .order('waktu_absen', { ascending: false });
    
    if(error || !data) {
      notify("Gagal memuat data absensi", "bg-rose-600");
      return;
    }
    
    // === 3. PRE-LOAD SEMUA TTD ===
    const signatureCache = {};
    
    await Promise.all(data.map(async (row, index) => {
      if(row.tanda_tangan_url && row.tanda_tangan_url !== '-' && row.tanda_tangan_url !== null) {
        try {
          const signatureBase64 = await loadImage(row.tanda_tangan_url);
          signatureCache[index] = signatureBase64;
        } catch(e) {
          signatureCache[index] = null;
        }
      } else {
        signatureCache[index] = null;
      }
    }));
    
    // === 4. HEADER ===
    const addHeader = (pageNumber) => {
      if(logoBase64 && pageNumber === 1) {
        doc.addImage(logoBase64, 'PNG', 15, 10, 25, 25);
      }
      
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(14).setFont("helvetica", "bold");
      doc.text("PENGURUS RUKUN WARGA 01 (RW.01)", 105, 18, { align: "center" });
      
      doc.setFontSize(9).setFont("helvetica", "normal");
      doc.text("Kelurahan Kebon Manggis, Kecamatan Matraman", 105, 24, { align: "center" });
      doc.text("Kota Administrasi Jakarta Timur", 105, 29, { align: "center" });
      
      doc.setFontSize(8);
      doc.text("Sistem Informasi Sinergi Digital RW.01", 105, 35, { align: "center" });
      
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.5);
      doc.line(15, 38, 195, 38);
      doc.setLineWidth(0.2);
      doc.line(15, 40, 195, 40);
      
      if(pageNumber === 1) {
        doc.setFontSize(12).setFont("helvetica", "bold");
        doc.text("LAPORAN PRESENSI KEGIATAN", 105, 50, { align: "center" });
        
        const printDate = new Date().toLocaleString('id-ID', {
          day: 'numeric', month: 'numeric', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        doc.setFontSize(8).setFont("helvetica", "normal");
        doc.text(`Dicetak pada: ${printDate}`, 15, 56);
      }
    };
    
    // === 5. TABEL - HANYA 7 KOLOM (TANPA KOLOM KOSONG) ===
    const tableBody = data.map((row, index) => [
      index + 1,
      row.nama_warga,
      row.rt,
      row.jabatan,
      row.kegiatan_id,
      new Date(row.waktu_absen).toLocaleDateString('id-ID', {
        day: 'numeric', month: 'long', year: 'numeric'
      }),
      '' // Kolom PARAF (kosong, akan diisi gambar TTD)
    ]);
    
    doc.autoTable({
      startY: 60,
      head: [['NO', 'NAMA', 'RT', 'JABATAN', 'KEGIATAN', 'TANGGAL', 'PARAF']],
      body: tableBody,
      
      // === AUTO PAGINATION ===
      pageBreak: 'auto',
      margin: { top: 60, bottom: 30 },
      
      // === GRID SETTINGS ===
      theme: 'grid',
      tableLineColor: [200, 200, 200],
      tableLineWidth: 0.2,
      
      headStyles: {
        fillColor: [5, 150, 105],
        textColor: 255,
        fontStyle: 'bold',
        halign: 'center',
        fontSize: 8,
        lineColor: [200, 200, 200],
        lineWidth: 0.2
      },
      
      alternateRowStyles: {
        fillColor: [250, 250, 250]
      },
      
      styles: {
        fontSize: 7,
        cellPadding: 2,
        valign: 'middle',
        lineColor: [200, 200, 200],
        lineWidth: 0.2,
        overflow: 'linebreak'
      },
      
      // === HANYA 7 KOLOM - WIDTH DISUAIKAN ===
      columnStyles: {
        0: { halign: 'center', cellWidth: 13 },   // NO
        1: { cellWidth: 35 },                      // NAMA
        2: { halign: 'center', cellWidth: 12 },   // RT
        3: { cellWidth: 30 },                      // JABATAN
        4: { cellWidth: 50 },                      // KEGIATAN
        5: { halign: 'left', cellWidth: 25 },     // TANGGAL
        6: { halign: 'center', cellWidth: 20 }    // PARAF (untuk TTD)
      },
      
      // === HEADER SETIAP HALAMAN ===
      didDrawPage: (data) => {
        addHeader(data.pageNumber);
      },
      
      // === GAMBAR TTD HANYA DI BODY (BUKAN HEADER) ===
      didDrawCell: (cellData) => {
        // Gambar border cell
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.2);
        doc.rect(cellData.cell.x, cellData.cell.y, cellData.cell.width, cellData.cell.height);
        
        // ✅ FIX: Hanya draw TTD di kolom PARAF (index 6) DAN di body (bukan header)
        if(cellData.column.index === 6 && cellData.section === 'body') {
          const signatureBase64 = signatureCache[cellData.row.index];
          
          if(signatureBase64) {
            // Hitung posisi tengah cell PARAF
            const imgWidth = 14;   // Lebar gambar TTD
            const imgHeight = 8;   // Tinggi gambar TTD
            const x = cellData.cell.x + (cellData.cell.width - imgWidth) / 2;
            const y = cellData.cell.y + (cellData.cell.height - imgHeight) / 2;
            
            // Gambar TTD di cell PARAF
            doc.addImage(signatureBase64, 'PNG', x, y, imgWidth, imgHeight);
          }
        }
      }
    });
    
    // === 6. TANDA TANGAN (FOOTER - Hanya Halaman Terakhir) ===
    const totalPages = doc.internal.getNumberOfPages();
    doc.setPage(totalPages);
    
    const finalY = doc.lastAutoTable.finalY + 20;
    
    doc.setFontSize(9).setFont("helvetica", "normal");
    doc.text(`Jakarta, ${new Date().toLocaleDateString('id-ID', {
      day: 'numeric', month: 'long', year: 'numeric'
    })}`, 150, finalY);
    
    doc.text("Ketua RW.01,", 150, finalY + 6);
    
    doc.setFontSize(9).setFont("helvetica", "italic");
    doc.text("Ditandatangani secara Digital", 150, finalY + 15);
    
    doc.setFontSize(10).setFont("helvetica", "bold");
    doc.text("Abdul Khadir Abu", 150, finalY + 25);
    
    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.3);
    doc.line(150, finalY + 27, 195, finalY + 27);
    
    // === 7. SAVE PDF ===
    doc.save(`Laporan_RW01_${Date.now()}.pdf`);
    notify("PDF Berhasil Diunduh!", "bg-emerald-600");
    
  } catch (err) {
    console.error(err);
    notify("Gagal membuat PDF: " + err.message, "bg-rose-600");
  }
}

// ============================================
// AUTHENTICATION
// ============================================
document.getElementById('form-login').onsubmit = async (e) => {
  e.preventDefault();
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  
  if (u === 'sekretaris' && p === 'adminrw01') {
    localStorage.setItem('user', JSON.stringify({nama:"Admin RW", jabatan:"Admin", username:"sekretaris", rt:"01"}));
    window.location.href = 'admin.html';
    return;
  }
  
  notify("Memverifikasi Akun...", "bg-blue-600");
  try {
    const { data, error } = await _supabase
      .from(TABLES.USERS)
      .select('*')
      .eq('username', u)
      .eq('password', p)
      .single();
    
    if(data && !error) {
      localStorage.setItem('user', JSON.stringify(data));
      data.jabatan === 'Admin' ? window.location.href='admin.html' : location.reload();
    } else {
      notify("Username/Password Salah!", "bg-rose-600");
    }
  } catch (err) {
    notify("Kesalahan Server", "bg-rose-600");
  }
};

document.getElementById('form-register').onsubmit = async (e) => {
  e.preventDefault();
  const rawJabatan = document.getElementById('reg-kategori').value;
  const subJab = document.getElementById('reg-sub-jabatan').value;
  const detMan = document.getElementById('reg-detail-manual').value;
  
  const payload = {
    nama: document.getElementById('reg-nama').value,
    rt: document.getElementById('reg-rt').value,
    nomor_hp: document.getElementById('reg-hp').value,
    username: document.getElementById('reg-user').value,
    password: document.getElementById('reg-pass').value,
    jabatan: subJab ? `${rawJabatan} (${subJab})` : rawJabatan,
    keterangan: detMan || "-"
  };
  
  notify("Mendaftarkan...", "bg-blue-600");
  try {
    const { data, error } = await _supabase
      .from(TABLES.USERS)
      .insert(payload)
      .select()
      .single();
    
    if(data && !error) {
      notify("Pendaftaran Berhasil!");
      setTimeout(()=>showPage('page-login'), 1500);
    } else {
      notify("Gagal Daftar: " + error.message, "bg-rose-600");
    }
  } catch (err) {
    notify("Gagal Daftar!", "bg-rose-600");
  }
};

// ============================================
// IMAGE VIEWER
// ============================================
function toggleZoom(el) {
  if (el.style.transform === "scale(2)") {
    el.style.transform = "scale(1)";
    el.classList.replace('cursor-zoom-out', 'cursor-zoom-in');
  } else {
    el.style.transform = "scale(2)";
    el.classList.replace('cursor-zoom-in', 'cursor-zoom-out');
  }
}

function viewImage(url, caption) {
  const img = document.getElementById('full-image');
  img.src = url;
  img.style.transform = "scale(1)";
  document.getElementById('image-caption').innerText = caption;
  document.getElementById('image-viewer').classList.remove('hidden');
  document.getElementById('image-viewer').classList.add('flex');
  lucide.createIcons();
}

function closeImageViewer() {
  document.getElementById('image-viewer').classList.add('hidden');
}

// ============================================
// ABSENSI
// ============================================
function bukaAbsen(judul) {
  document.getElementById('abs-kegiatan-id').value = judul;
  document.getElementById('modal-absen').classList.remove('hidden');
  const canvas = document.getElementById('canvas-ttd');
  canvas.width = canvas.offsetWidth;
  signaturePad = new SignaturePad(canvas);
}

document.getElementById('form-submit-absen').onsubmit = async (e) => {
  e.preventDefault();
  const user = JSON.parse(localStorage.getItem('user'));
  const file = document.getElementById('abs-selfie').files[0];
  
  if(!file || signaturePad.isEmpty()) return alert("Foto Selfie dan TTD Wajib!");
  
  notify("Mengirim Absensi...", "bg-blue-600");
  try {
    const fileName = `absen_${Date.now()}.jpg`;
    const { error: uploadError } = await _supabase.storage
      .from('media-sinergi')
      .upload(`absen/${fileName}`, file);
    
    if(uploadError) throw uploadError;
    
    const { data: dFoto } = _supabase.storage
      .from('media-sinergi')
      .getPublicUrl(`absen/${fileName}`);
    
    const payload = {
      nama_warga: user.nama,
      rt: user.rt,
      jabatan: user.jabatan,
      waktu_absen: new Date().toISOString(),
      kegiatan_id: document.getElementById('abs-kegiatan-id').value,
      photo_selfie_url: dFoto.publicUrl,
      tanda_tangan_url: signaturePad.toDataURL()
    };
    
    const { error: insertError } = await _supabase
      .from(TABLES.ABSENSI)
      .insert(payload);
    
    if(insertError) throw insertError;
    
    notify("Absensi Berhasil Terkirim ✓");
    document.getElementById('modal-absen').classList.add('hidden');
    switchTabWarga('riwayat');
  } catch (err) {
    notify("Gagal Mengirim: " + err.message, "bg-rose-600");
  }
};

// ============================================
// LOGOUT
// ============================================
function logout() {
  localStorage.clear();
  location.reload();
}

// ============================================
// INIT
// ============================================
window.onload = () => {
  const user = JSON.parse(localStorage.getItem('user'));
  if(user) {
    if(user.jabatan === 'Admin') {
      window.location.href = 'admin.html';
    } else {
      showPage('page-user');
      document.getElementById('kartu-nama').innerText = user.nama;
      document.getElementById('kartu-jabatan').innerText = user.jabatan;
      document.getElementById('kartu-rt').innerText = user.rt;
      updateLiveTime();
      loadRunningText();
      switchTabWarga('pengumuman');
    }
  }
  lucide.createIcons();
};
