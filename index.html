body { font-family: 'Inter', sans-serif; overflow-x: hidden; background: #f8fafc; }
.page { min-height: 100vh; }
.animate-fade { animation: fadeIn 0.3s ease-out; }

canvas { border: 2px dashed #cbd5e1; background: #f8fafc; border-radius: 1rem; width: 100%; height: 150px; touch-action: none; }

.running-text-container { background: #fef3c7; overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 36px; border-bottom: 1px solid #fde68a; }
.running-text-content { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; font-size: 11px; font-weight: 800; color: #78350f; text-transform: uppercase; letter-spacing: 0.5px; }
@keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
.nav-active { color: #059669 !important; font-weight: 900; }
.nav-active i { transform: translateY(-3px); transition: 0.2s; }
.cursor-zoom-in { cursor: zoom-in; }
.cursor-zoom-out { cursor: zoom-out; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border-radius: 12px; cursor: pointer; position: relative; background: #f1f5f9; color: #64748b; transition: 0.2s; }
.day-has-event { background: #ecfdf5; color: #059669; border: 1px solid #10b981; }

.event-dot { width: 4px; height: 4px; background: #10b981; border-radius: 50%; position: absolute; bottom: 4px; }
#toast { transition: all 0.3s ease; }
.footer-credit { opacity: 0.5; transition: 0.3s; }

</style>

<script>
// ============================================
// CONFIG - SAMA DENGAN ADMIN.HTML
// ============================================
const SB_URL = "https://kbzlgrpeerllbvpiyhpf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiemxncnBlZXJsbGJ2cGl5aHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDY2NTksImV4cCI6MjA4NzUyMjY1OX0.8n4lPZs9t6Zo4Wk5TmdcEt1wqpa7_CeGH9EdM-WKX2w";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

// Table names
const TABLES = {
  USERS: 'users',
  PENGUMUMAN: 'pengumuman',
  ABSENSI: 'absensi',
  AGENDA: 'agenda',
  DOKUMENTASI: 'dokumentasi',
  PENGAJUAN: 'pengajuan_surat',
  SETTINGS: 'settings'
};

let signaturePad;

// ============================================
// UTILITY FUNCTIONS
// ============================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  lucide.createIcons();
}

function togglePass(id) {
  const el = document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
  lucide.createIcons();
}

function notify(msg, color = "bg-emerald-600") {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.className = `fixed top-8 right-4 z-[999] px-6 py-3 rounded-xl text-white font-bold animate-fade ${color}`;
  t.classList.remove('hidden'); 
  setTimeout(() => t.classList.add('hidden'), 3000);
}

function updateLiveTime() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if(document.getElementById('live-clock')) document.getElementById('live-clock').innerText = timeStr;
  if(document.getElementById('live-date')) document.getElementById('live-date').innerText = dateStr;
}
setInterval(updateLiveTime, 1000);

// ============================================
// SUB-JABATAN LOGIC (LENGKAP)
// ============================================
function updateSubJabatan() {
  const kat = document.getElementById('reg-kategori').value;
  const subCont = document.getElementById('reg-sub-jabatan-container');
  const sub = document.getElementById('reg-sub-jabatan');
  const detCont = document.getElementById('reg-detail-manual-container');
  
  subCont.classList.add('hidden'); 
  detCont.classList.add('hidden'); 
  sub.innerHTML = '';
  
  if (kat === 'Pengurus RW') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="Ketua RW">Ketua RW</option><option value="Wakil Ketua RW">Wakil Ketua RW</option><option value="Sekretaris RW">Sekretaris RW</option><option value="Bendahara RW">Bendahara RW</option>';
  } else if (kat === 'Pengurus RT') {
    subCont.classList.remove('hidden');
    sub.innerHTML = '<option value="Ketua RT">Ketua RT</option><option value="Sekretaris RT">Sekretaris RT</option><option value="Bendahara RT">Bendahara RT</option>';
  } else if (kat === 'Kader') {
    subCont.classList.remove('hidden'); 
    detCont.classList.remove('hidden');
    sub.innerHTML = '<option value="PKK">Kader PKK</option><option value="Jumantik">Kader Jumantik</option><option value="DAWIS">Kader DAWIS</option><option value="Posyandu">Kader Posyandu</option>';
  } else if (kat === 'Seksi Pendidikan') {
    subCont.classList.remove('hidden'); 
    detCont.classList.remove('hidden');
    sub.innerHTML = '<option value="PAUD">Guru PAUD</option><option value="Guru Ngaji">Guru Ngaji</option>';
  } else if (kat === 'Keamanan') {
    subCont.classList.remove('hidden'); 
    sub.innerHTML = '<option value="Kordinator Keamanan">Kordinator Keamanan</option><option value="Anggota Keamanan">Angota keamanan</option>';
  } else if (kat === 'Kebersihan') {
    subCont.classList.remove('hidden'); 
    sub.innerHTML = 'sub.innerHTML = '<option value="Petugas Kebersihan">Petugas Kebersihan</option><option value="Petugas Bank Sampah">Petugas Bank Sampah</option>';
  } else if (kat === 'Karang Taruna') {
    subCont.classList.remove('hidden'); 
    sub.innerHTML = 'sub.innerHTML = '<option value="KETUA">KETUA</option><option value="ANGGOTA">ANGGOTA</option>';  
  }
}

// ============================================
// RUNNING TEXT
// ============================================
async function loadRunningText() {
  try {
    const { data, error } = await _supabase
      .from(TABLES.SETTINGS)
      .select('value')
      .eq('key', 'running_text')
      .single();
    
    if(data && !error) document.getElementById('running-text-val').innerText = data.value + " • ";
  } catch(e) {}
}

// ============================================
// NAVIGATION WARGA
// ============================================
async function switchTabWarga(tab) {
  const list = document.getElementById('user-content-area');
  const user = JSON.parse(localStorage.getItem('user'));
  
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
  if(document.getElementById(`nav-${tab}`)) document.getElementById(`nav-${tab}`).classList.add('nav-active');
  
  list.innerHTML = '<div class="flex flex-col items-center justify-center py-20 gap-3"><div class="w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Sinkronisasi Data...</p></div>';
  
  try {
    if(tab === 'pengumuman') {
      const { data, error } = await _supabase
        .from(TABLES.PENGUMUMAN)
        .select('*')
        .order('created_at', { ascending: false });
      
      if(error || !data) {
        list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-rose-400 uppercase">Gagal memuat pengumuman</p>';
        return;
      }
      
      list.innerHTML = data.map(i => `
        <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden animate-fade mb-6">
          ${i.file_url && i.file_url !== '-' ? `<img src="${i.file_url}" onclick="viewImage('${i.file_url}', '${i.judul}')" class="w-full h-52 object-cover cursor-zoom-in">` : `<div class="w-full h-32 bg-slate-50 flex items-center justify-center"><i data-lucide="megaphone" class="w-12 h-12 text-slate-200"></i></div>`}
          <div class="p-6">
            <div class="flex justify-between items-center mb-3 text-[8px] font-black uppercase">
              <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100">${i.tipe}</span>
              <span class="text-slate-400">${new Date(i.created_at).toLocaleDateString('id-ID')}</span>
            </div>
            <h4 class="font-black text-lg uppercase leading-tight mb-2 text-slate-800">${i.judul}</h4>
            <p class="text-slate-500 text-xs leading-relaxed mb-6">${i.detail}</p>
            ${i.pdf_url && i.pdf_url !== '-' ? `<a href="${i.pdf_url}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-blue-50 text-blue-600 py-3 rounded-xl font-black text-[10px] uppercase mb-3 border border-blue-100"><i data-lucide="file-text" class="w-4 h-4"></i> Lihat Dokumen PDF</a>` : ''}
            ${i.tipe === 'Kegiatan' ? `<button onclick="bukaAbsen('${i.judul}')" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-emerald-100 active:scale-95 transition-all">Isi Daftar Hadir Sekarang</button>` : ''}
          </div>
        </div>`).join('');
        
    } else if(tab === 'dokumentasi') {
      const { data, error } = await _supabase
        .from(TABLES.DOKUMENTASI)
        .select('*')
        .order('created_at', { ascending: false });
      
      if(error || !data) {
        list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-rose-400 uppercase">Gagal memuat galeri</p>';
        return;
      }
      
      list.innerHTML = `<div class="grid grid-cols-2 gap-4">
        ${data.map(d => {
          const imgLink = d.foto_url || '-';
          return `
          <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm animate-fade" onclick="viewImage('${imgLink}', '${d.judul}')">
            <img src="${imgLink}" class="w-full h-40 object-cover bg-slate-50">
            <div class="p-3">
              <p class="text-[9px] font-black uppercase truncate text-slate-700">${d.judul}</p>
              <p class="text-[7px] text-slate-400 font-bold mt-1 uppercase">${new Date(d.created_at).toLocaleDateString('id-ID')}</p>
            </div>
          </div>`;
        }).join('')}
      </div>`;
      
    } else if(tab === 'agenda') {
      const { data, error } = await _supabase
        .from(TABLES.AGENDA)
        .select('*')
        .order('tanggal', { ascending: true });
      
      if(error || !data) {
        list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-rose-400 uppercase">Gagal memuat agenda</p>';
        return;
      }
      
      const allEvents = data;
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      
      list.innerHTML = `
      <div class="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm animate-fade">
        <div class="flex justify-between items-center mb-4">
          <h4 class="font-black text-xs uppercase text-emerald-800">${monthNames[currentMonth]} ${currentYear}</h4>
          <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-emerald-500"></div><span class="text-[7px] font-bold text-slate-400 uppercase">Agenda</span></div>
        </div>
        <div class="calendar-grid text-center mb-2">
          ${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d => `<div class="text-[8px] font-black text-slate-300 uppercase">${d}</div>`).join('')}
        </div>
        <div id="calendar-days" class="calendar-grid"></div>
      </div>
      <div id="event-details" class="space-y-3 mt-4">
        <p class="text-center py-10 text-[9px] font-black text-slate-300 uppercase tracking-widest">Pilih tanggal yang ditandai</p>
      </div>`;
      
      const calDays = document.getElementById('calendar-days');
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      
      for(let i=0; i<firstDay; i++) calDays.innerHTML += `<div></div>`;
      for(let day=1; day<=daysInMonth; day++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const hasEvent = allEvents.find(e => e.tanggal === dateStr);
        const isToday = day === now.getDate() ? 'border-2 border-emerald-200' : '';
        const dayEl = document.createElement('div');
        dayEl.className = `calendar-day ${hasEvent ? 'day-has-event' : ''} ${isToday}`;
        dayEl.innerHTML = `${day} ${hasEvent ? '<div class="event-dot"></div>' : ''}`;
        dayEl.onclick = () => {
          document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('day-selected'));
          dayEl.classList.add('day-selected');
          showEventDetail(hasEvent);
        };
        calDays.appendChild(dayEl);
      }
      
      function showEventDetail(event) {
        const detailCont = document.getElementById('event-details');
        if(!event) {
          detailCont.innerHTML = `<div class="bg-slate-50 p-6 rounded-3xl text-center border-2 border-dashed border-slate-100">
            <p class="text-[9px] font-black text-slate-400 uppercase">Tidak ada agenda di tanggal ini</p>
          </div>`;
          return;
        }
        detailCont.innerHTML = `
        <div class="bg-white p-5 rounded-[2rem] border-2 border-emerald-100 shadow-md animate-fade">
          <div class="flex items-center gap-3 mb-3">
            <div class="bg-emerald-100 text-emerald-600 p-2 rounded-xl"><i data-lucide="calendar" class="w-5 h-5"></i></div>
            <div>
              <p class="text-[8px] font-black text-emerald-600 uppercase">Agenda Kegiatan</p>
              <h4 class="font-black text-sm uppercase text-slate-800 leading-tight">${event.kegiatan}</h4>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-50">
            <div class="flex items-center gap-2">
              <i data-lucide="clock" class="w-3 h-3 text-slate-400"></i>
              <span class="text-[9px] font-bold text-slate-500 uppercase">${event.jam}</span>
            </div>
            <div class="flex items-center gap-2 text-right justify-end">
              <i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i>
              <span class="text-[9px] font-bold text-slate-500 uppercase truncate">${event.lokasi}</span>
            </div>
          </div>
        </div>`;
        lucide.createIcons();
      }
      
    } else if(tab === 'surat') {
      list.innerHTML = `
        <div class="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100 animate-up">
          <div class="text-center mb-6">
            <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <i data-lucide="file-text" class="w-7 h-7"></i>
            </div>
            <h3 class="font-extrabold text-sm uppercase tracking-tighter text-slate-800">Pengajuan Surat</h3>
            <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">RW.01 Kebon Manggis</p>
          </div>
          <div class="space-y-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Jenis Surat</label>
            <input type="text" id="jenis-surat" placeholder="Contoh: Surat Pengantar Domisili" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 font-bold text-sm outline-none focus:border-emerald-500">
            <button onclick="kirimSurat()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold uppercase text-xs btn-press flex items-center justify-center gap-2 shadow-lg shadow-emerald-100 active:scale-95 transition-all">
              <i data-lucide="send" class="w-4 h-4"></i> Minta Tanda Tangan
            </button>
          </div>
          <p class="text-[8px] text-slate-400 text-center mt-4 font-bold uppercase">Pengajuan akan dikirim langsung ke WhatsApp Admin</p>
        </div>`;
      lucide.createIcons();
    }
      
    } else if(tab === 'riwayat') {
      const { data, error } = await _supabase
        .from(TABLES.ABSENSI)
        .select('*')
        .eq('nama_warga', user.nama)
        .order('waktu_absen', { ascending: false });
      
      const myAbsen = data || [];
      
      list.innerHTML = `
      <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm mb-4 flex flex-col items-center">
        <div id="qrcode"></div>
        <p class="text-[9px] font-black text-emerald-600 uppercase mt-3 tracking-widest">${user.username}</p>
      </div>
      ${(user.jabatan.includes('Ketua') || user.jabatan.includes('Sekretaris') || user.jabatan === 'Admin') ? `
      <div class="bg-amber-50 p-4 rounded-3xl border border-amber-100 mb-6">
        <p class="text-[9px] font-black text-amber-700 uppercase mb-3">Menu Sekretariat</p>
        <button onclick="generateLaporanPDF()" class="w-full bg-amber-500 text-white py-3 rounded-2xl font-black text-[10px] uppercase flex items-center justify-center gap-2 shadow-lg shadow-amber-100">
          <i data-lucide="file-down" class="w-4 h-4"></i> Cetak Daftar Hadir Semua Warga
        </button>
      </div>` : ''}
      <h5 class="text-[10px] font-black uppercase text-slate-400 mb-3 px-2 flex items-center gap-2"><i data-lucide="clock" class="w-3 h-3"></i> Riwayat Absen Anda</h5>
      <div class="space-y-3">
        ${myAbsen.length > 0 ? myAbsen.map(r => `
        <div class="bg-white p-4 rounded-3xl flex items-center gap-4 border border-slate-50">
          <img src="${r.photo_selfie_url}" class="w-12 h-12 object-cover rounded-xl" onclick="viewImage('${r.photo_selfie_url}', 'Bukti Hadir')">
          <div class="flex-1">
            <p class="font-black text-[10px] uppercase text-slate-800">${r.kegiatan_id}</p>
            <p class="text-[8px] text-slate-400 uppercase mt-1 font-bold">${new Date(r.waktu_absen).toLocaleString('id-ID')}</p>
          </div>
          <img src="${r.tanda_tangan_url}" class="w-10 h-10 object-contain opacity-50">
        </div>`).join('') : '<p class="text-center py-10 text-[10px] font-bold text-slate-400 uppercase">Belum ada riwayat absensi</p>'}
      </div>`;
      
      QRCode(document.getElementById("qrcode"), { text: user.username, width: 120, height: 120 });
    }
    
    lucide.createIcons();
  } catch(err) {
    console.error(err);
    list.innerHTML = '<p class="text-center py-10 text-[10px] font-bold text-rose-400 uppercase">Gagal memuat data</p>';
  }
}

// ============================================
// PDF GENERATOR
// ============================================
async function generateLaporanPDF() {
  notify("Menyiapkan Dokumen...", "bg-blue-600");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  const { data, error } = await _supabase
    .from(TABLES.ABSENSI)
    .select('*')
    .order('waktu_absen', { ascending: false });
  
  if(error || !data) {
    notify("Gagal memuat data absensi", "bg-rose-600");
    return;
  }
  
  doc.setFontSize(14); doc.setFont("helvetica", "bold");
  doc.text("PENGURUS RUKUN WARGA 01", 105, 20, { align: "center" });
  doc.setFontSize(10); doc.setFont("helvetica", "normal");
  doc.text("KELURAHAN KEBON MANGGIS - KECAMATAN MATRAMAN", 105, 25, { align: "center" });
  doc.setFontSize(8); doc.text("Sekretariat: Jl. Kebon Manggis I, Jakarta Timur", 105, 29, { align: "center" });
  doc.line(20, 32, 190, 32); doc.line(20, 33, 190, 33);
  
  doc.setFontSize(11); doc.setFont("helvetica", "bold");
  doc.text("DAFTAR HADIR KEGIATAN WARGA", 105, 45, { align: "center" });
  
  const tableBody = data.map((row, index) => [
    index + 1, row.nama_warga, row.rt, row.jabatan, row.kegiatan_id, new Date(row.waktu_absen).toLocaleDateString('id-ID')
  ]);
  
  doc.autoTable({
    startY: 52,
    head: [['NO', 'NAMA WARGA', 'RT', 'JABATAN', 'KEGIATAN', 'TANGGAL']],
    body: tableBody,
    theme: 'grid',
    headStyles: { fillColor: [5, 150, 105], halign: 'center' },
    styles: { fontSize: 8, cellPadding: 3 },
    columnStyles: { 0: { halign: 'center' }, 2: { halign: 'center' } }
  });
  
  const finalY = doc.lastAutoTable.finalY + 15;
  doc.setFontSize(9);
  doc.text("Jakarta, " + new Date().toLocaleDateString('id-ID'), 150, finalY);
  doc.text("Sekretaris RW.01,", 150, finalY + 5);
  doc.text("( ____________________ )", 150, finalY + 25);
  
  doc.save("Laporan_Absensi_RW01.pdf");
  notify("PDF Berhasil Diunduh!", "bg-emerald-600");
}

}function kirimSurat() {
  const jenis = document.getElementById('jenis-surat').value;
  const user = JSON.parse(localStorage.getItem('user'));
  
  if(!jenis) return alert("Isi jenis surat!");
  
  const msg = encodeURIComponent(`Halo Admin RW.01, saya ${user.nama} (${user.rt}) ingin mengajukan: ${jenis}. Mohon bantuannya.`);
  window.open(`https://wa.me/628812558415?text=${msg}`, '_blank');
  
  notify("Mengarahkan ke WhatsApp...", "bg-emerald-600");
}

    
// ============================================
// AUTHENTICATION
// ============================================
document.getElementById('form-login').onsubmit = async (e) => {
  e.preventDefault();
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  
  if (u === 'sekretaris' && p === 'adminrw01') {
    localStorage.setItem('user', JSON.stringify({nama:"Admin RW", jabatan:"Admin", username:"sekretaris", rt:"01"}));
    window.location.href = 'admin.html'; 
    return;
  }
  
  notify("Memverifikasi Akun...", "bg-blue-600");
  try {
    const { data, error } = await _supabase
      .from(TABLES.USERS)
      .select('*')
      .eq('username', u)
      .eq('password', p)
      .single();
    
    if(data && !error) {
      localStorage.setItem('user', JSON.stringify(data));
      data.jabatan === 'Admin' ? window.location.href='admin.html' : location.reload();
    } else { 
      notify("Username/Password Salah!", "bg-rose-600"); 
    }
  } catch (err) { 
    notify("Kesalahan Server", "bg-rose-600"); 
  }
};

document.getElementById('form-register').onsubmit = async (e) => {
  e.preventDefault();
  const rawJabatan = document.getElementById('reg-kategori').value;
  const subJab = document.getElementById('reg-sub-jabatan').value;
  const detMan = document.getElementById('reg-detail-manual').value;
  
  const payload = {
    nama: document.getElementById('reg-nama').value,
    rt: document.getElementById('reg-rt').value,
    nomor_hp: document.getElementById('reg-hp').value,
    username: document.getElementById('reg-user').value,
    password: document.getElementById('reg-pass').value,
    jabatan: subJab ? `${rawJabatan} (${subJab})` : rawJabatan,
    keterangan: detMan || "-"
  };
  
  notify("Mendaftarkan...", "bg-blue-600");
  try {
    const { data, error } = await _supabase
      .from(TABLES.USERS)
      .insert(payload)
      .select()
      .single();
    
    if(data && !error) { 
      notify("Pendaftaran Berhasil!"); 
      setTimeout(()=>showPage('page-login'), 1500); 
    } else {
      notify("Gagal Daftar: " + error.message, "bg-rose-600");
    }
  } catch (err) { 
    notify("Gagal Daftar!", "bg-rose-600"); 
  }
};

// ============================================
// IMAGE VIEWER
// ============================================
function toggleZoom(el) {
  if (el.style.transform === "scale(2)") {
    el.style.transform = "scale(1)";
    el.classList.replace('cursor-zoom-out', 'cursor-zoom-in');
  } else {
    el.style.transform = "scale(2)";
    el.classList.replace('cursor-zoom-in', 'cursor-zoom-out');
  }
}

function viewImage(url, caption) {
  const img = document.getElementById('full-image');
  img.src = url; 
  img.style.transform = "scale(1)";
  document.getElementById('image-caption').innerText = caption;
  document.getElementById('image-viewer').classList.remove('hidden');
  document.getElementById('image-viewer').classList.add('flex');
  lucide.createIcons();
}

function closeImageViewer() { 
  document.getElementById('image-viewer').classList.add('hidden'); 
}

// ============================================
// ABSENSI
// ============================================
function bukaAbsen(judul) {
  document.getElementById('abs-kegiatan-id').value = judul;
  document.getElementById('modal-absen').classList.remove('hidden');
  const canvas = document.getElementById('canvas-ttd');
  canvas.width = canvas.offsetWidth;
  signaturePad = new SignaturePad(canvas);
}

document.getElementById('form-submit-absen').onsubmit = async (e) => {
  e.preventDefault();
  const user = JSON.parse(localStorage.getItem('user'));
  const file = document.getElementById('abs-selfie').files[0];
  
  if(!file || signaturePad.isEmpty()) return alert("Foto Selfie dan TTD Wajib!");
  
  notify("Mengirim Absensi...", "bg-blue-600");
  try {
    const fileName = `absen_${Date.now()}.jpg`;
    const { error: uploadError } = await _supabase.storage
      .from('media-sinergi')
      .upload(`absen/${fileName}`, file);
    
    if(uploadError) throw uploadError;
    
    const { data: dFoto } = _supabase.storage
      .from('media-sinergi')
      .getPublicUrl(`absen/${fileName}`);
    
    const payload = {
      nama_warga: user.nama, 
      rt: user.rt, 
      jabatan: user.jabatan,
      waktu_absen: new Date().toISOString(),
      kegiatan_id: document.getElementById('abs-kegiatan-id').value,
      photo_selfie_url: dFoto.publicUrl,
      tanda_tangan_url: signaturePad.toDataURL()
    };
    
    const { error: insertError } = await _supabase
      .from(TABLES.ABSENSI)
      .insert(payload);
    
    if(insertError) throw insertError;
    
    notify("Absensi Berhasil Terkirim ✓");
    document.getElementById('modal-absen').classList.add('hidden');
    switchTabWarga('riwayat');
  } catch (err) { 
    notify("Gagal Mengirim: " + err.message, "bg-rose-600"); 
  }
};

// ============================================
// PENGAJUAN SURAT
// ============================================
async function kirimPengajuanSurat() {
  const user = JSON.parse(localStorage.getItem('user'));
  const jenis = document.getElementById('jenis-surat').value;
  
  if(!jenis) return alert("Pilih jenis surat!");
  
  notify("Mengirim Permohonan...", "bg-blue-600");
  try {
    const payload = {
      nama: user.nama, 
      rt: user.rt, 
      hp: user.nomor_hp || "-",
      jenis_surat: jenis, 
      keterangan: document.getElementById('ket-surat').value || "-",
      status: "Menunggu", 
      waktu_pengajuan: new Date().toISOString()
    };
    
    const { error } = await _supabase
      .from(TABLES.PENGAJUAN)
      .insert(payload);
    
    if(error) throw error;
    
    notify("Pengajuan Terkirim ✓");
    switchTabWarga('pengumuman');
  } catch (err) { 
    notify("Gagal Mengirim!", "bg-rose-600"); 
  }
}

// LOGOUT
// ============================================
function logout() { 
  localStorage.clear(); 
  location.reload(); 
}

// ============================================
window.onload = () => {
  const user = JSON.parse(localStorage.getItem('user'));
  if(user) {
    if(user.jabatan === 'Admin') { 
      window.location.href = 'admin.html'; 
    } else {
      showPage('page-user');
      document.getElementById('kartu-nama').innerText = user.nama;
      document.getElementById('kartu-jabatan').innerText = user.jabatan;
      document.getElementById('kartu-rt').innerText = user.rt;
      updateLiveTime();
      loadRunningText();
      switchTabWarga('pengumuman');
    }
  }
  lucide.createIcons();
};
