<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sinergi RW.01 - Kebon Manggis</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; overflow-x: hidden; }
.animate-fade { animation: fadeIn 0.3s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.branding-line { height: 5px; width: 100%; background: linear-gradient(to right, #e11d48 25%, #f8fafc 25%, #f8fafc 50%, #fbbf24 50%, #fbbf24 75%, #059669 75%); position: fixed; top: 0; left: 0; z-index: 1000; }
.running-text-container { background: #fef3c7; overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 36px; border-bottom: 1px solid #fde68a; }
.running-text-content { display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite; font-size: 11px; font-weight: 800; color: #78350f; will-change: transform; }
@keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
.nav-active { color: #059669 !important; font-weight: 900; }
canvas { border: 2px dashed #cbd5e1; background: #f8fafc; border-radius: 1rem; width: 100%; height: 150px; touch-action: none; }
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="pb-24">

<div class="branding-line"></div>
<div id="toast" class="fixed top-8 right-4 z-[999] px-6 py-3 rounded-xl shadow-2xl text-white font-bold hidden"></div>

<div id="page-login" class="page flex items-center justify-center p-4 min-h-screen animate-fade">
  <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center border border-slate-100">
    <img class="w-20 h-20 mx-auto mb-4" src="https://ybuobehttmorjdiqwfta.supabase.co/storage/v1/object/public/Logo/1746898459176.png">
    <h1 class="text-xl font-black text-emerald-700 uppercase">Sinergi RW.01</h1>
    <p class="text-[9px] font-bold text-slate-400 mt-2 tracking-[0.3em]">KEBON MANGGIS</p>
    <form id="form-login" class="mt-8 space-y-4 text-left">
      <input type="text" id="login-user" placeholder="Username" class="w-full border-2 border-slate-50 bg-slate-50 p-4 rounded-2xl outline-none focus:border-emerald-500" required>
      <input type="password" id="login-pass" placeholder="Password" class="w-full border-2 border-slate-50 bg-slate-50 p-4 rounded-2xl outline-none focus:border-emerald-500" required>
      <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-all">Masuk</button>
    </form>
    <p class="mt-6 text-sm text-slate-500 font-medium">Warga baru? <button onclick="showPage('page-register')" class="text-emerald-600 font-black">Daftar Akun</button></p>
  </div>
</div>

<div id="page-register" class="page hidden flex items-center justify-center p-4 min-h-screen animate-fade">
  <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-100 overflow-y-auto max-h-[90vh]">
    <h2 class="text-lg font-black text-center uppercase mb-6 text-emerald-800">Registrasi</h2>
    <form id="form-register" class="space-y-3">
      <input type="text" id="reg-nama" placeholder="Nama Lengkap" class="w-full border-2 border-slate-100 bg-slate-50 p-3 rounded-xl text-xs outline-none focus:border-emerald-400" required>
      <div class="grid grid-cols-2 gap-3">
        <select id="reg-rt" class="border-2 border-slate-100 bg-slate-50 p-3 rounded-xl text-xs font-bold" required>
          <option value="">Pilih RT</option>
          <script>for(let i=1;i<=16;i++) document.write(`<option value="RT ${i.toString().padStart(2,'0')}">RT ${i.toString().padStart(2,'0')}</option>`)</script>
        </select>
        <input type="tel" id="reg-hp" placeholder="WhatsApp" class="border-2 border-slate-100 bg-slate-50 p-3 rounded-xl text-xs outline-none" required>
      </div>
      <select id="reg-kategori" onchange="updateSubJabatan()" class="w-full p-3 border-2 border-slate-100 bg-slate-50 rounded-xl text-xs font-bold">
        <option value="Warga">Warga Biasa</option>
        <option value="Pengurus RW">Pengurus RW</option>
        <option value="Pengurus RT">Pengurus RT</option>
        <option value="Kader">Kader (PKK/Jumantik/dll)</option>
      </select>
      <div id="reg-sub-jabatan-container" class="hidden">
        <select id="reg-sub-jabatan" class="w-full p-3 border-2 border-emerald-100 bg-emerald-50 rounded-xl text-xs font-bold text-emerald-700"></select>
      </div>
      <div id="reg-detail-manual-container" class="hidden">
        <input type="text" id="reg-detail-manual" placeholder="Detail Jabatan (Contoh: Seksi Humas)" class="w-full border-2 border-emerald-100 bg-emerald-50 p-3 rounded-xl text-xs outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input type="text" id="reg-user" placeholder="Username" class="border-2 border-slate-100 bg-slate-50 p-3 rounded-xl text-xs outline-none" required>
        <input type="password" id="reg-pass" placeholder="Password" class="border-2 border-slate-100 bg-slate-50 p-3 rounded-xl text-xs outline-none" required>
      </div>
      <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase text-xs mt-4">Daftar Akun</button>
      <button type="button" onclick="showPage('page-login')" class="w-full text-slate-400 text-[10px] font-bold uppercase text-center py-2">Batal</button>
    </form>
  </div>
</div>

<div id="page-user" class="page hidden">
  <header class="bg-white px-6 py-4 border-b flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <img class="w-10 h-10" src="https://ybuobehttmorjdiqwfta.supabase.co/storage/v1/object/public/Logo/1746898459176.png">
      <span class="font-black text-emerald-700 text-lg tracking-tighter">SINERGI 01</span>
    </div>
    <button onclick="logout()" class="text-rose-600 font-black text-[10px] uppercase bg-rose-50 px-3 py-2 rounded-lg">Keluar</button>
  </header>
  
  <div class="running-text-container">
    <div class="running-text-content" id="running-text-val">Memuat informasi terbaru warga...</div>
  </div>
  
  <main class="p-4 space-y-4">
    <div class="bg-emerald-600 p-6 rounded-[2rem] text-white shadow-xl relative overflow-hidden">
      <div class="absolute -right-4 -bottom-4 opacity-10"><i data-lucide="user" class="w-24 h-24"></i></div>
      <div class="relative z-10 flex justify-between items-start">
        <div>
            <p class="text-[10px] font-black opacity-80 uppercase tracking-widest">Identitas Digital</p>
            <h2 id="kartu-nama" class="text-xl font-black uppercase mt-1 leading-tight">...</h2>
        </div>
        <div class="text-right">
            <p id="live-clock" class="text-xl font-black leading-none">00:00:00</p>
            <p id="live-date" class="text-[10px] font-bold opacity-80 uppercase mt-1 tracking-tighter">...</p>
        </div>
      </div>
      <div class="flex items-center gap-2 mt-4 relative z-10">
        <span id="kartu-jabatan" class="text-[9px] bg-white/20 px-3 py-1.5 rounded-full font-bold border border-white/10">...</span>
        <span id="kartu-rt" class="text-[9px] bg-amber-400 text-amber-900 px-3 py-1.5 rounded-full font-black">...</span>
      </div>
    </div>
    
    <div id="user-content-area" class="min-h-[400px]"></div>

    <div class="mt-12 pb-12 flex flex-col items-center justify-center text-center opacity-40">
      <div class="h-[1px] w-12 bg-slate-200 mb-4"></div>
      <p class="text-[11px] font-black tracking-[0.2em] text-slate-500 uppercase">©2026 createdby:sekretariat_team</p>
      <p id="footer-user-name" class="text-[9px] font-bold text-slate-400 mt-1 uppercase"></p>
    </div>
  </main>
  
  <footer class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-3 flex justify-around z-[100]">
    <button onclick="switchTabWarga('pengumuman')" class="nav-item flex flex-col items-center text-slate-400" id="nav-pengumuman"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold mt-1">BERANDA</span></button>
    <button onclick="switchTabWarga('agenda')" class="nav-item flex flex-col items-center text-slate-400" id="nav-agenda"><i data-lucide="calendar" class="w-5 h-5"></i><span class="text-[8px] font-bold mt-1">AGENDA</span></button>
    <button onclick="switchTabWarga('dokumentasi')" class="nav-item flex flex-col items-center text-slate-400" id="nav-dokumentasi"><i data-lucide="camera" class="w-5 h-5"></i><span class="text-[8px] font-bold mt-1">GALERI</span></button>
    <button onclick="switchTabWarga('pengajuan')" class="nav-item flex flex-col items-center text-slate-400" id="nav-pengajuan"><i data-lucide="file-text" class="w-5 h-5"></i><span class="text-[8px] font-bold mt-1">SURAT</span></button>
    <button onclick="switchTabWarga('riwayat')" class="nav-item flex flex-col items-center text-slate-400" id="nav-riwayat"><i data-lucide="history" class="w-5 h-5"></i><span class="text-[8px] font-bold mt-1">RIWAYAT</span></button>
  </footer>
</div>

<script>
const SB_URL = "https://ybuobehttmorjdiqwfta.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidW9iZWh0dG1vcmpkaXF3ZnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjQyMTMsImV4cCI6MjA4NzEwMDIxM30.dzdldaWRLjyTV-NK5LXZKxI2mK1MDYLHKRBXCDpMHPE";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

// UPDATE JAM & WAKTU REAL-TIME
function startClock() {
    setInterval(() => {
        const now = new Date();
        const clock = document.getElementById('live-clock');
        const dateEl = document.getElementById('live-date');
        if(clock) clock.innerText = now.toLocaleTimeString('id-ID', {hour12: false});
        if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'short', year:'numeric'});
    }, 1000);
}

// LOGIKA SUB-JABATAN
function updateSubJabatan() {
  const kat = document.getElementById('reg-kategori').value;
  const subContainer = document.getElementById('reg-sub-jabatan-container');
  const subSelect = document.getElementById('reg-sub-jabatan');
  const manualContainer = document.getElementById('reg-detail-manual-container');
  
  subContainer.classList.add('hidden');
  manualContainer.classList.add('hidden');
  subSelect.innerHTML = "";

  const options = {
    "Pengurus RW": ["Ketua RW", "Sekretaris RW", "Bendahara RW", "Seksi Humas", "Seksi Sosial"],
    "Pengurus RT": ["Ketua RT", "Sekretaris RT", "Bendahara RT"],
    "Kader": ["Dawis/PKK", "Jumantik", "Posyandu", "Dasawisma"]
  };

  if (options[kat]) {
    subContainer.classList.remove('hidden');
    options[kat].forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.innerText = s;
      subSelect.appendChild(opt);
    });
  }
  if (kat !== "Warga") manualContainer.classList.remove('hidden');
}

// SWITCH TAB WARGA
async function switchTabWarga(tab) {
  const list = document.getElementById('user-content-area');
  const user = JSON.parse(localStorage.getItem('user'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
  document.getElementById(`nav-${tab}`).classList.add('nav-active');
  list.innerHTML = '<div class="flex justify-center py-20"><div class="w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div></div>';

  try {
    if (tab === 'pengumuman') {
      const { data } = await _supabase.from('pengumuman').select('*').order('created_at', { ascending: false });
      list.innerHTML = data.map(i => `
        <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden mb-6">
          ${i.file_url && i.file_url !== '-' ? `<img src="${i.file_url}" class="w-full h-52 object-cover">` : ''}
          <div class="p-6">
            <h4 class="font-black text-lg uppercase leading-tight mb-3">${i.judul}</h4>
            <p class="text-slate-500 text-xs mb-6">${i.detail}</p>
            ${i.tipe === 'Kegiatan' ? `<button onclick="bukaAbsen('${i.judul}')" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-emerald-100">Hadir di Lokasi</button>` : ''}
          </div>
        </div>`).join('');

    } else if (tab === 'dokumentasi') {
      const { data } = await _supabase.from('dokumentasi').select('*').order('created_at', { ascending: false });
      list.innerHTML = `<div class="grid grid-cols-2 gap-3">
        ${data.map(img => `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 flex flex-col">
            <div class="relative">
              <img src="${img.file_url}" class="w-full h-40 object-cover">
              <button onclick="this.querySelector('i').classList.toggle('fill-rose-500')" class="absolute top-2 right-2 bg-white/80 backdrop-blur-md p-1.5 rounded-full"><i data-lucide="heart" class="w-4 h-4 text-slate-400"></i></button>
            </div>
            <div class="p-3"><h5 class="text-[10px] font-black uppercase line-clamp-2 text-slate-700 h-8">${img.keterangan}</h5></div>
          </div>
        `).join('')}
      </div>`;

    } else if (tab === 'riwayat') {
      const { data } = await _supabase.from('absensi').select('*').eq('nama_warga', user.nama).order('waktu_absen', { ascending: false });
      list.innerHTML = `
        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 mb-6 flex flex-col items-center shadow-sm">
          <div id="qrcode" class="p-2 border-4 border-emerald-50 rounded-2xl"></div>
          <p class="text-[10px] font-black text-slate-400 mt-4 uppercase tracking-[0.3em]">${user.username}</p>
        </div>
        <div class="flex justify-between items-center mb-4 px-2">
          <h3 class="font-black text-[10px] text-slate-400 uppercase tracking-widest">Riwayat Absen</h3>
          <button onclick="downloadRiwayat()" class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full font-black text-[9px] uppercase border border-emerald-100 flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i> PDF</button>
        </div>
        <div class="space-y-3">${data.map(r => `
          <div class="bg-white p-4 rounded-3xl flex items-center gap-4 border border-slate-50 shadow-sm">
            <img src="${r.photo_selfie_url}" class="w-12 h-12 object-cover rounded-2xl bg-slate-50">
            <div class="flex-1">
              <p class="font-black text-[11px] uppercase leading-tight">${r.kegiatan_id}</p>
              <p class="text-[9px] text-slate-400 font-bold mt-1">${new Date(r.waktu_absen).toLocaleString('id-ID')}</p>
            </div>
            <i data-lucide="check" class="w-4 h-4 text-emerald-600"></i>
          </div>`).join('')}</div>`;
      new QRCode(document.getElementById("qrcode"), { text: user.username, width: 150, height: 150 });
    }
    lucide.createIcons();
  } catch(e) { console.error(e); }
}

// INIT & LOGIN LOGIC
window.onload = () => {
  const user = JSON.parse(localStorage.getItem('user'));
  if(user) {
    showPage('page-user');
    document.getElementById('kartu-nama').innerText = user.nama;
    document.getElementById('kartu-jabatan').innerText = user.jabatan;
    document.getElementById('kartu-rt').innerText = user.rt;
    document.getElementById('footer-user-name').innerText = user.nama;
    startClock();
    switchTabWarga('pengumuman');
  }
  lucide.createIcons();
};

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function logout() { localStorage.clear(); location.reload(); }

document.getElementById('form-login').onsubmit = async (e) => {
  e.preventDefault();
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  const { data } = await _supabase.from('users').select('*').eq('username', u).eq('password', p).single();
  if(data) { localStorage.setItem('user', JSON.stringify(data)); location.reload(); }
  else { alert("Login Gagal!"); }
};
</script>
</body>
</html>
